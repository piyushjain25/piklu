<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guess the Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky-top:#A8E0FF; --sky-bot:#D9F6E4;
    --ink:#33236B; --ink-soft:#6a5aa0;
    --grape:#6C4AB6; --grape-dark:#553a95;
    --sun:#FFCF43; --sun-dark:#e6a800;
    --coral:#FF6B7A; --coral-dark:#e24a5c;
    --leaf:#2FB37D; --leaf-dark:#218a60;
    --sky:#3FA7E0; --sky-dark:#2b86ba;
    --card:#FFFFFF; --key-line:#E4DCF5;
    --shadow:0 18px 40px rgba(72,45,130,.18);
    --radius:26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif; color:var(--ink); min-height:100vh;
    background:linear-gradient(180deg,var(--sky-top) 0%,#C6ECEC 45%,var(--sky-bot) 100%);
    background-attachment:fixed;
    display:flex; align-items:flex-start; justify-content:center; padding:22px 14px 60px;
  }
  body::before,body::after{
    content:""; position:fixed; z-index:0; border-radius:50%;
    background:rgba(255,255,255,.55); filter:blur(1px);
    box-shadow:60px 10px 0 -6px rgba(255,255,255,.55), 120px 4px 0 -10px rgba(255,255,255,.5);
  }
  body::before{width:90px;height:34px;top:8%;left:6%;}
  body::after{width:70px;height:26px;top:16%;right:10%;}

  .app{position:relative; z-index:1; width:100%; max-width:720px;}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px;}

  .brand{display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:4px;}
  .title{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(28px,5.5vw,42px);
    line-height:1; margin:0; text-align:center;}
  .title .c1{color:var(--grape);} .title .c2{color:var(--coral);}
  .title .c3{color:var(--leaf);} .title .c4{color:var(--sun-dark);}
  .subtitle{text-align:center; color:var(--ink-soft); font-weight:700; margin:2px 0 20px; font-size:15px;}

  /* owl */
  .owl{width:60px; height:60px; flex:0 0 auto;}
  .owl .pupil{transition:transform .2s ease;}
  .owl .brow{transition:transform .2s ease; transform-origin:center;}
  .owl.worried .brow-l{transform:rotate(14deg) translateY(-1px);}
  .owl.worried .brow-r{transform:rotate(-14deg) translateY(-1px);}
  .owl.happy .beak,.owl.win .beak{transform:translateY(1px) scale(1.05);}

  /* buttons */
  .btn{font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px; border:none; cursor:pointer;
    color:#fff; border-radius:16px; padding:13px 22px; position:relative;
    transition:transform .06s ease, filter .15s ease; box-shadow:0 5px 0 var(--btn-shadow,#0003);}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--btn-shadow,#0003);}
  .btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px;}
  .btn-primary{background:var(--grape); --btn-shadow:var(--grape-dark);}
  .btn-go{background:var(--leaf); --btn-shadow:var(--leaf-dark);}
  .btn-sun{background:var(--sun); color:var(--ink); --btn-shadow:var(--sun-dark);}
  .btn-ghost{background:#F1EDFA; color:var(--grape); --btn-shadow:#d9d0ef;}
  .btn:disabled{filter:grayscale(.35) opacity(.55); cursor:not-allowed;}
  .btn-lg{font-size:20px; padding:16px 34px;}

  .block-label{font-family:'Fredoka',sans-serif; font-weight:600; color:var(--grape); font-size:15px;
    text-transform:uppercase; letter-spacing:1px; margin:20px 0 10px;}

  /* mode cards */
  .modes{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:520px){.modes{grid-template-columns:1fr 1fr;}}
  .mode{border:3px solid #EEE8FB; background:#fff; border-radius:20px; cursor:pointer; padding:22px 16px;
    text-align:center; transition:all .15s ease;}
  .mode:focus-visible{outline:3px solid var(--grape); outline-offset:2px;}
  .mode .m-emoji{font-size:44px; line-height:1;}
  .mode .m-name{font-family:'Fredoka',sans-serif; font-weight:600; font-size:20px; margin-top:8px;}
  .mode .m-desc{font-size:13px; font-weight:700; color:var(--ink-soft); margin-top:3px;}
  .mode[aria-pressed="true"]{border-color:var(--mc,var(--grape)); background:var(--mbg,#F4F0FE);
    transform:translateY(-2px); box-shadow:var(--shadow);}
  .mode.india{--mc:var(--sun-dark); --mbg:#FFF6DC;}
  .mode.world{--mc:var(--sky); --mbg:#E6F4FC;}

  .seg{display:flex; gap:8px; background:#F1EDFA; padding:6px; border-radius:16px; max-width:320px; margin:0 auto;}
  .seg button{flex:1; border:none; background:transparent; cursor:pointer; font-family:'Fredoka',sans-serif;
    font-weight:600; font-size:15px; color:var(--ink-soft); padding:10px 6px; border-radius:11px;}
  .seg button[aria-pressed="true"]{background:#fff; color:var(--grape); box-shadow:0 3px 10px rgba(108,74,182,.2);}
  .seg button:focus-visible{outline:3px solid var(--grape); outline-offset:2px;}

  .center{text-align:center;} .mt{margin-top:22px;}
  .row-btns{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}

  /* quiz top bar */
  .qtop{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .chip{font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:#fff; background:var(--grape);
    padding:6px 14px; border-radius:999px;}
  .chip.score{background:var(--leaf);} .chip.streak{background:var(--sun); color:var(--ink);}
  .progress{height:10px; background:#EEE8FB; border-radius:999px; overflow:hidden; margin:12px 0 4px;}
  .progress i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--grape),var(--sky));
    border-radius:999px; transition:width .3s ease;}

  /* prompt */
  .prompt{text-align:center; margin:16px 0 6px;}
  .flag{height:110px; display:flex; align-items:center; justify-content:center; margin-bottom:8px;}
  .flag .flag-emoji{font-size:84px; line-height:1;}
  .flag .flag-img{display:none; height:96px; width:auto; border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.18);
    border:2px solid #fff;}
  .india-badge{font-size:48px; line-height:1; margin-bottom:6px;}
  .ask{font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink-soft); font-size:15px;}
  .place{font-family:'Fredoka',sans-serif; font-weight:700; color:var(--grape);
    font-size:clamp(24px,6vw,34px); line-height:1.15; margin-top:2px;}

  /* options */
  .options{display:grid; grid-template-columns:1fr; gap:12px; margin:18px 0 6px;}
  @media(min-width:520px){.options{grid-template-columns:1fr 1fr;}}
  .opt{border:3px solid #EEE8FB; background:#fff; border-radius:16px; cursor:pointer; padding:16px 14px;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:18px; color:var(--ink);
    text-align:left; display:flex; align-items:center; gap:12px; transition:all .12s ease;}
  .opt:hover:not(:disabled){border-color:var(--grape); transform:translateY(-1px);}
  .opt:focus-visible{outline:3px solid var(--grape); outline-offset:2px;}
  .opt .num{font-family:'Fredoka',sans-serif; font-weight:600; background:#F1EDFA; color:var(--grape);
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex:0 0 auto;}
  .opt.correct{background:var(--leaf); border-color:var(--leaf-dark); color:#fff;}
  .opt.correct .num{background:rgba(255,255,255,.3); color:#fff;}
  .opt.wrong{background:#FFE1E6; border-color:var(--coral); color:var(--coral-dark);}
  .opt.wrong .num{background:var(--coral); color:#fff;}
  .opt:disabled{cursor:default;}

  .feedback{min-height:30px; text-align:center; font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:17px; margin:10px 0 2px;}
  .feedback.good{color:var(--leaf-dark);} .feedback.bad{color:var(--coral-dark);}
  .fact{text-align:center; background:#F4F0FE; border-radius:14px; padding:10px 14px; color:var(--ink);
    font-weight:700; font-size:14px; margin:4px 0; display:none;}
  .fact.show{display:block;}

  .qfooter{display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:16px; flex-wrap:wrap;}

  /* overlay */
  .overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:18px;
    background:rgba(51,35,107,.45); backdrop-filter:blur(3px);}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:26px; box-shadow:var(--shadow); padding:30px 28px; max-width:440px;
    width:100%; text-align:center; animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .modal h2{font-family:'Fredoka',sans-serif; font-size:28px; margin:10px 0 2px;}
  .modal .big-face{font-size:56px; line-height:1;}
  .modal .score-line{font-family:'Fredoka',sans-serif; font-weight:700; font-size:34px; color:var(--grape); margin:8px 0;}
  .modal .stars{font-size:30px; letter-spacing:4px; margin:4px 0 8px;}
  .modal p{color:var(--ink-soft); font-weight:700; margin:6px 0 18px;}

  canvas#confetti{position:fixed; inset:0; z-index:60; pointer-events:none; display:none;}
  .hide{display:none !important;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="card">

    <!-- ===== HOME ===== -->
    <section id="screen-home">
      <div class="brand">
        <svg class="owl" id="owl-home" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M14 10 L22 20 L10 20 Z" fill="#6C4AB6"/><path d="M50 10 L54 20 L42 20 Z" fill="#6C4AB6"/>
          <circle cx="32" cy="34" r="22" fill="#6C4AB6"/><circle cx="32" cy="38" r="15" fill="#F4EEFF"/>
          <g><circle cx="24" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="24" cy="28" r="4" fill="#33236B"/></g>
          <g><circle cx="40" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="28" r="4" fill="#33236B"/></g>

          <path class="brow brow-r" d="M33 19 Q40 15 47 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path class="beak" d="M32 32 L28 38 L36 38 Z" fill="#FFCF43"/>
        </svg>
        <h1 class="title" id="title"></h1>
      </div>
      <p class="subtitle">Pick the right capital city — can you get them all?</p>

      <div class="block-label">Choose a game</div>
      <div class="modes" role="group" aria-label="Game mode">
        <button class="mode india" id="mode-india" aria-pressed="true">
          <div class="m-emoji">🏛️</div><div class="m-name">Indian States</div>
          <div class="m-desc">28 state capitals</div>
        </button>
        <button class="mode world" id="mode-world" aria-pressed="false">
          <div class="m-emoji">🌍</div><div class="m-name">World Countries</div>
          <div class="m-desc">capitals with flags</div>
        </button>
      </div>

      <div class="block-label">How many questions?</div>
      <div class="seg" role="group" aria-label="Number of questions">
        <button data-n="10" aria-pressed="true">10</button>
        <button data-n="20" aria-pressed="false">20</button>
        <button data-n="0" aria-pressed="false">All</button>
      </div>

      <div class="row-btns mt"><button id="start-btn" class="btn btn-go btn-lg">Start Quiz ▶</button></div>
    </section>

    <!-- ===== QUIZ ===== -->
    <section id="screen-quiz" class="hide">
      <div class="qtop">
        <span class="chip" id="q-count">Question 1 of 10</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="chip score" id="q-score">Score 0</span>
          <span class="chip streak" id="q-streak">🔥 0</span>
          <svg class="owl" id="owl-quiz" viewBox="0 0 64 64" aria-hidden="true" style="width:44px;height:44px;">
            <path d="M14 10 L22 20 L10 20 Z" fill="#6C4AB6"/><path d="M50 10 L54 20 L42 20 Z" fill="#6C4AB6"/>
            <circle cx="32" cy="34" r="22" fill="#6C4AB6"/><circle cx="32" cy="38" r="15" fill="#F4EEFF"/>
            <g><circle cx="24" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="24" cy="28" r="4" fill="#33236B"/></g>
            <g><circle cx="40" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="28" r="4" fill="#33236B"/></g>
            <path class="brow brow-l" d="M17 19 Q24 15 31 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path class="brow brow-r" d="M33 19 Q40 15 47 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path class="beak" d="M32 32 L28 38 L36 38 Z" fill="#FFCF43"/>
          </svg>
        </div>
      </div>
      <div class="progress"><i id="q-progress"></i></div>

      <div class="prompt">
        <div class="flag hide" id="flag-wrap">
          <span class="flag-emoji" id="flag-emoji"></span>
          <img class="flag-img" id="flag-img" alt="" />
        </div>
        <div class="india-badge hide" id="india-badge">🏛️</div>
        <div class="ask" id="ask">What is the capital of</div>
        <div class="place" id="place">—</div>
      </div>

      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="fact" id="fact"></div>

      <div class="qfooter">
        <button id="home-btn" class="btn btn-ghost">🏠 Home</button>
        <button id="next-btn" class="btn btn-primary" disabled>Next ▶</button>
      </div>
    </section>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="big-face" id="modal-face">🎉</div>
    <h2 id="modal-title">Great job!</h2>
    <div class="score-line" id="modal-score">0 / 10</div>
    <div class="stars" id="modal-stars"></div>
    <p id="modal-sub"></p>
    <div class="row-btns">
      <button id="modal-again" class="btn btn-go">Play Again ▶</button>
      <button id="modal-home" class="btn btn-ghost">🏠 Home</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

 "capital": "Copenhagen", "iso2": "dk", "fact": ""}, {"name": "Finland", "capital": "Helsinki", "iso2": "fi", "fact": ""}, {"name": "Iceland", "capital": "Reykjavik", "iso2": "is", "fact": "Reykjavik is the world's most northern capital."}, {"name": "Poland", "capital": "Warsaw", "iso2": "pl", "fact": ""}, {"name": "Ukraine", "capital": "Kyiv", "iso2": "ua", "fact": ""}, {"name": "Hungary", "capital": "Budapest", "iso2": "hu", "fact": ""}, {"name": "Czech Republic", "capital": "Prague", "iso2": "cz", "fact": ""}, {"name": "Egypt", "capital": "Cairo", "iso2": "eg", "fact": "Cairo is close to the famous Pyramids."}, {"name": "Morocco", "capital": "Rabat", "iso2": "ma", "fact": "Rabat is the capital, not Casablanca."}, {"name": "Nigeria", "capital": "Abuja", "iso2": "ng", "fact": "Abuja became the capital in 1991, replacing Lagos."}, {"name": "Kenya", "capital": "Nairobi", "iso2": "ke", "fact": ""}, {"name": "Ethiopia", "capital": "Addis Ababa", "iso2": "et", "fact": ""}, {"name": "Ghana", "capital": "Accra", "iso2": "gh", "fact": ""}, {"name": "Tanzania", "capital": "Dodoma", "iso2": "tz", "fact": "Dodoma is the capital, not Dar es Salaam."}, {"name": "South Africa", "capital": "Pretoria", "iso2": "za", "fact": "South Africa has three capital cities! Pretoria is the main one."}, {"name": "United States", "capital": "Washington, D.C.", "iso2": "us", "fact": "The capital is Washington, D.C., not New York City."}, {"name": "Canada", "capital": "Ottawa", "iso2": "ca", "fact": "Ottawa is the capital, not Toronto."}, {"name": "Mexico", "capital": "Mexico City", "iso2": "mx", "fact": ""}, {"name": "Cuba", "capital": "Havana", "iso2": "cu", "fact": ""}, {"name": "Jamaica", "capital": "Kingston", "iso2": "jm", "fact": ""}, {"name": "Brazil", "capital": "Brasília", "iso2": "br", "fact": "Brasília was specially built to be the capital in 1960."}, {"name": "Argentina", "capital": "Buenos Aires", "iso2": "ar", "fact": ""}, {"name": "Chile", "capital": "Santiago", "iso2": "cl", "fact": ""}, {"name": "Peru", "capital": "Lima", "iso2": "pe", "fact": ""}, {"name": "Colombia", "capital": "Bogotá", "iso2": "co", "fact": ""}, {"name": "Australia", "capital": "Canberra", "iso2": "au", "fact": "The capital is Canberra, not Sydney!"}, {"name": "New Zealand", "capital": "Wellington", "iso2": "nz", "fact": "Wellington is the capital, not Auckland."}]};

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let DATA = (typeof EMBEDDED_CAPITALS !== "undefined") ? EMBEDDED_CAPITALS : {india:[],world:[]};

// load external capitals.json when served; fall back to embedded
(async function(){
  try{
    const res = await fetch("capitals.json",{cache:"no-store"});
    if(res.ok){ const d=await res.json(); if(d&&d.india&&d.world) DATA=d; }
  }catch(e){}
})();

const $ = id => document.getElementById(id);
let mode = "india";
let numQuestions = 10;
let muted = false;

// ---- helpers ----
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function flagEmoji(iso){ return String(iso).toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0))); }

// ---- home ----
function setMode(m){
  mode=m;
  $("mode-india").setAttribute("aria-pressed", m==="india");
  $("mode-world").setAttribute("aria-pressed", m==="world");
}
$("mode-india").onclick=()=>setMode("india");
$("mode-world").onclick=()=>setMode("world");
document.querySelectorAll(".seg button").forEach(b=>{
  b.onclick=()=>{ numQuestions=parseInt(b.dataset.n,10);
    document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed", x===b)); };
});

// ---- quiz state ----
let game=null;
$("start-btn").onclick=startQuiz;
$("modal-again").onclick=()=>{ hideOverlay(); startQuiz(); };
$("modal-home").onclick=()=>{ hideOverlay(); goHome(); };
$("home-btn").onclick=goHome;
$("next-btn").onclick=nextQuestion;

function startQuiz(){
  const pool = DATA[mode] || [];
  if(!pool.length){ alert("No data available for this game."); return; }
  const order = shuffle(pool.map((_,i)=>i));
  const total = (numQuestions>0) ? Math.min(numQuestions, order.length) : order.length;
  game = { pool, order, total, i:0, score:0, streak:0, answered:false };
  $("screen-home").classList.add("hide");
  $("screen-quiz").classList.remove("hide");
  setOwl("quiz","idle");
  renderQuestion();
}

function uniqueCapitals(pool){
  const set=new Set(); pool.forEach(x=>set.add(x.capital)); return [...set];
}

function renderQuestion(){
  game.answered=false;
  const item = game.pool[game.order[game.i]];
  game.current = item;
  // build 4 options
  const caps = uniqueCapitals(game.pool).filter(c=>c!==item.capital);
  const distractors = shuffle(caps).slice(0,3);
  const options = shuffle([item.capital, ...distractors]);
  game.correctIdx = options.indexOf(item.capital);

  // prompt
  $("q-count").textContent = `Question ${game.i+1} of ${game.total}`;
  $("q-score").textContent = `Score ${game.score}`;
  $("q-streak").textContent = `🔥 ${game.streak}`;
  $("q-progress").style.width = `${(game.i/game.total)*100}%`;
  $("place").textContent = item.name;

  if(mode==="world"){
    $("flag-wrap").classList.remove("hide");
    $("india-badge").classList.add("hide");
    const emoji = flagEmoji(item.iso2);
    $("flag-emoji").textContent = emoji;
    $("flag-emoji").style.display = "";
    const img = $("flag-img");
    img.style.display="none";
    img.onload = ()=>{ img.style.display="block"; $("flag-emoji").style.display="none"; };
    img.onerror = ()=>{ img.style.display="none"; $("flag-emoji").style.display=""; };
    img.src = `https://flagcdn.com/w320/${String(item.iso2).toLowerCase()}.png`;
  } else {
    $("flag-wrap").classList.add("hide");
    $("india-badge").classList.remove("hide");
  }

  // options
  const box=$("options"); box.innerHTML="";
  options.forEach((cap,idx)=>{
    const b=document.createElement("button");
    b.className="opt"; b.dataset.idx=idx;
    b.innerHTML=`<span class="num">${idx+1}</span><span>${cap}</span>`;
    b.onclick=()=>answer(idx,b);
    box.appendChild(b);
  });

  $("feedback").textContent=""; $("feedback").className="feedback";
  $("fact").textContent=""; $("fact").classList.remove("show");
  $("next-btn").disabled=true;
  $("next-btn").textContent = (game.i+1>=game.total) ? "See Score ⭐" : "Next ▶";
}

function answer(idx, btn){
  if(game.answered) return;
  game.answered=true;
  const item=game.current;
  const buttons=[...document.querySelectorAll(".opt")];
  buttons.forEach(b=>b.disabled=true);
  const correct = idx===game.correctIdx;
  buttons[game.correctIdx].classList.add("correct");
  if(correct){
    game.score++; game.streak++;
    $("feedback").textContent = pickPraise();
    $("feedback").className="feedback good";
    setOwl("quiz","happy"); sound("good");
    if(!reduceMotion) miniConfetti();
  } else {
    game.streak=0;
    if(btn) btn.classList.add("wrong");
    $("feedback").textContent = `The capital is ${item.capital}.`;
    $("feedback").className="feedback bad";
    setOwl("quiz","worried"); sound("bad");
  }
  $("q-score").textContent = `Score ${game.score}`;
  $("q-streak").textContent = `🔥 ${game.streak}`;
  if(item.fact){ $("fact").textContent = "💡 " + item.fact; $("fact").classList.add("show"); }
  //speakText(item.capital);
  $("next-btn").disabled=false;
  $("next-btn").focus();
}

function pickPraise(){
  const p=["Correct! 🎉","Yes! Well done! 🌟","That's right! 👏","Brilliant! ✨","You got it! 🙌"];
  return p[Math.floor(Math.random()*p.length)];
}

function nextQuestion(){
  game.i++;
  if(game.i>=game.total){ finish(); return; }
  renderQuestion();
}

function finish(){
  $("q-progress").style.width="100%";
  const s=game.score, t=game.total, pct=s/t;
  const stars = Math.max(1, Math.round(pct*5));
  $("modal-score").textContent = `${s} / ${t}`;
  $("modal-stars").textContent = "⭐".repeat(stars) + "☆".repeat(5-stars);
  let face,title,sub;
  if(pct===1){ face="🏆"; title="Perfect score!"; sub="Wow — you knew every single one!"; }
  else if(pct>=0.7){ face="🎉"; title="Great job!"; sub="You know your capitals really well!"; }
  else if(pct>=0.4){ face="🙂"; title="Nice try!"; sub="Getting better every time — play again!"; }
  else { face="🦉"; title="Good start!"; sub="Capitals are tricky. Let's practise some more!"; }
  $("modal-face").textContent=face; $("modal-title").textContent=title; $("modal-sub").textContent=sub;
  $("overlay").classList.add("show");
  setOwl("quiz", pct>=0.7?"win":"idle");
  if(pct>=0.7 && !reduceMotion) launchConfetti();
}

function goHome(){
  hideOverlay();
  $("screen-quiz").classList.add("hide");
  $("screen-home").classList.remove("hide");
  setOwl("home","idle");
}
function hideOverlay(){ $("overlay").classList.remove("show"); stopConfetti(); }

// keyboard: 1-4 to answer, Enter/Space for next
document.addEventListener("keydown", e=>{
  if($("screen-quiz").classList.contains("hide")) return;
  if(!game) return;
  if(["1","2","3","4"].includes(e.key) && !game.answered){
    const b=document.querySelector(`.opt[data-idx="${parseInt(e.key,10)-1}"]`);
    if(b) b.click();
  } else if((e.key==="Enter"||e.key===" ") && game.answered && !$("next-btn").disabled){
    e.preventDefault(); nextQuestion();
  }
});

// ---- owl ----
function setOwl(where,mood){
  const owl=$(where==="home"?"owl-home":"owl-quiz"); if(!owl) return;
  owl.classList.remove("happy","worried","win"); if(mood!=="idle") owl.classList.add(mood);
}

// ---- sound + speech ----
let audioCtx=null;
function beep(freq,dur,type="sine",when=0,gain=0.15){
  if(muted) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime+when, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(gain,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
function sound(kind){
  if(kind==="good"){ beep(660,.12,"triangle"); beep(880,.14,"triangle",.08); }
  else if(kind==="bad"){ beep(200,.22,"sawtooth",0,.12); }
}
function speakText(txt){
  try{
    if(muted || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(txt)); u.rate=0.9; u.pitch=1.05; u.lang="en-US";
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ---- confetti ----
let confettiRAF=null;
function launchConfetti(){
  const cv=$("confetti"); cv.style.display="block"; const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const colors=["#6C4AB6","#FF6B7A","#2FB37D","#FFCF43","#3FA7E0"];
  const parts=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
    r:5+Math.random()*7,c:colors[Math.floor(Math.random()*colors.length)],vy:2+Math.random()*3,
    vx:-1.5+Math.random()*3,rot:Math.random()*6,vr:-.2+Math.random()*.4}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    f++; if(f<220) confettiRAF=requestAnimationFrame(draw); else stopConfetti();})();
}
function miniConfetti(){ /* light burst on correct */
  const cv=$("confetti"); cv.style.display="block"; const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const colors=["#2FB37D","#FFCF43","#3FA7E0","#FF6B7A"];
  const parts=Array.from({length:40},()=>({x:cv.width/2,y:cv.height*0.35,r:5+Math.random()*6,
    c:colors[Math.floor(Math.random()*colors.length)],vy:-4+Math.random()*2,vx:-4+Math.random()*8,rot:0,vr:.2}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    f++; if(f<60) requestAnimationFrame(draw); else stopConfetti();})();
}
function stopConfetti(){ if(confettiRAF) cancelAnimationFrame(confettiRAF);
  const cv=$("confetti"); if(cv){ cv.getContext("2d").clearRect(0,0,cv.width,cv.height); cv.style.display="none"; } }

// ---- bouncy title ----
(function(){
  const word="Guess the Capital"; const cls=["c1","c2","c3","c4"]; const el=$("title"); let ci=0;
  for(const ch of word){
    if(ch===" "){ el.appendChild(document.createTextNode("\u00A0")); continue; }
    const s=document.createElement("span"); s.textContent=ch; s.className=cls[ci++%cls.length];
    if(!reduceMotion) s.style.animation=`bob 2.4s ease-in-out ${(ci*0.06).toFixed(2)}s infinite`;
    el.appendChild(s);
  }
  if(!reduceMotion){ const st=document.createElement("style");
    st.textContent="@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}";
    document.head.appendChild(st); }
})();

setMode("india");
</script>
