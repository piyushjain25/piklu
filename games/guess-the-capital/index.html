<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guess the Capital</title>
<link rel="stylesheet" href="../../assets/site.css" />
<style>
  .optlist{--opt-pad:16px 14px; --opt-size:18px; --opt-num:30px; --opt-numsize:15px;}
  .app{--app-w:var(--app-wide);}
  .modes{display:grid; grid-template-columns:1fr; gap:14px;}
  @container card (min-width:460px){.modes{grid-template-columns:1fr 1fr;}}
  .mode{border:3px solid #EEE8FB; background:#fff; border-radius:20px; cursor:pointer; padding:22px 16px;
    text-align:center; transition:all .15s ease;}
  .mode:focus-visible{outline:3px solid var(--grape); outline-offset:2px;}
  .mode .m-emoji{font-size:44px; line-height:1;}
  .mode .m-name{font-family:'Fredoka',sans-serif; font-weight:600; font-size:20px; margin-top:8px;}
  .mode .m-desc{font-size:13px; font-weight:700; color:var(--ink-soft); margin-top:3px;}
  .mode[aria-pressed="true"]{border-color:var(--mc,var(--grape)); background:var(--mbg,#F4F0FE);
    transform:translateY(-2px); box-shadow:var(--shadow);}
  .mode.india{--mc:var(--sun-dark); --mbg:#FFF6DC;}
  .mode.world{--mc:var(--sky); --mbg:#E6F4FC;}
  .topbar{margin-bottom:18px;}
  .prompt{text-align:center; margin:0 0 6px;}
  .flag{height:110px; display:flex; align-items:center; justify-content:center; margin-bottom:8px;}
  .flag .flag-emoji{font-size:84px; line-height:1;}
  .flag .flag-img{display:none; height:96px; width:auto; border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.18);
    border:2px solid #fff;}
  .india-badge{font-size:48px; line-height:1; margin-bottom:6px;}
  .ask{font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink-soft); font-size:15px;}
  .place{font-family:'Fredoka',sans-serif; font-weight:700; color:var(--grape);
    font-size:clamp(24px,7.1cqw,34px); line-height:1.15; margin-top:2px;}
  .result{padding:8px 4px 4px;}
  .fact{text-align:center; background:#F4F0FE; border-radius:14px; padding:10px 14px; color:var(--ink);
    font-weight:700; font-size:14px; margin:10px 0 4px; display:none;}
  .fact.show{display:block;}
</style>
</head>
<body class="game">
<div class="app">
  <div class="card">

    <!-- ===== HOME ===== -->
    <section id="screen-home">
      <div class="home-top"><a class="hub-link" href="../">← All games</a></div>
      <div class="brand">
        <svg class="owl" id="owl-home"></svg>
        <h1 class="title" id="title"></h1>
      </div>
      <p class="subtitle">Pick the right capital city — can you get them all?</p>

      <div class="block-label">Choose a game</div>
      <div class="modes" role="group" aria-label="Game mode">
        <button class="mode india" id="mode-india" aria-pressed="true">
          <div class="m-emoji">🏛️</div><div class="m-name">Indian States</div>
          <div class="m-desc">28 state capitals</div>
        </button>
        <button class="mode world" id="mode-world" aria-pressed="false">
          <div class="m-emoji">🌍</div><div class="m-name">World Countries</div>
          <div class="m-desc">capitals with flags</div>
        </button>
      </div>

      <div class="howto">
        📌 <b>How to play:</b> Read the state or country, then tap the matching capital city. A wrong
        pick gets crossed out so you can try again — tap <b>💡 Hint</b> if you'd like one ruled out for you.
      </div>
      <div class="row-btns mt"><button id="start-btn" class="btn btn-go btn-lg">Start ▶</button></div>
    </section>

    <!-- ===== QUIZ ===== -->
    <section id="screen-quiz" class="hide">
      <div class="topbar">
        <button id="home-btn" class="tlink">🏠 Home</button>
        <div class="tb-center">
          <svg class="owl" id="owl-quiz" style="width:40px;height:40px;"></svg>
        </div>
        <div class="tb-right">
          <button id="skip-btn" class="tlink">⏭ Skip</button>
        </div>
      </div>

      <div class="prompt">
        <div class="flag hide" id="flag-wrap">
          <span class="flag-emoji" id="flag-emoji"></span>
          <img class="flag-img" id="flag-img" alt="" />
        </div>
        <div class="india-badge hide" id="india-badge">🏛️</div>
        <div class="ask" id="ask">What is the capital of</div>
        <div class="place" id="place">—</div>
      </div>

      <div class="optlist" id="options"></div>
      <div id="result-view" class="hide"><div class="result"><div class="rlabel" id="rlabel"></div></div></div>
      <div class="fact" id="fact"></div>
      <div class="feedback" id="feedback"></div>
      <div id="serve-view">
        <div class="actions">
          <button id="hint-link" class="tlink">💡 Hint</button>
        </div>
      </div>
      <div class="serve-row">
        <button id="next-btn" class="btn btn-primary invisible">Next ▶</button>
      </div>
    </section>
  </div>
</div>
<canvas id="confetti"></canvas>

<script src="../../assets/site.js"></script>
<script>
// This game only works when served (fetch() is blocked under file://) — no embedded
// fallback data, by design: see CLAUDE.md.
let DATA = {india:[],world:[]};

loadGameData("capitals.json").then(d => {
  if(d && d.india && d.world) DATA = d;
});

const rnd = n => Math.floor(Math.random()*n);

// ---- helpers ----
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]];} return a; }
function flagEmoji(iso){ return String(iso).toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0))); }
function uniqueCapitals(pool){ const set=new Set(); pool.forEach(x=>set.add(x.capital)); return [...set]; }

/* ===== engine ===== */
function genQuestion(mode){
  const pool = DATA[mode] || [];
  if(!pool.length) return null;
  const item = pool[rnd(pool.length)];
  const caps = uniqueCapitals(pool).filter(c=>c!==item.capital);
  const distractors = shuffle(caps).slice(0, 3);
  const options = shuffle([item.capital, ...distractors]);
  return { mode, item, options, correctIdx: options.indexOf(item.capital) };
}

/* ===== state ===== */
let mode = "india", Q = null, phase = "play", prevSig = null;

function setMode(m){
  mode=m;
  $("mode-india").setAttribute("aria-pressed", m==="india");
  $("mode-world").setAttribute("aria-pressed", m==="world");
}
$("mode-india").onclick=()=>setMode("india");
$("mode-world").onclick=()=>setMode("world");

$("start-btn").onclick = startQuiz;
$("home-btn").onclick = goHome;
$("skip-btn").onclick = ()=>{ if(phase!=='play') return; newQuestion(); };
$("next-btn").onclick = newQuestion;
$("hint-link").onclick = giveHint;

function startQuiz(){
  showScreen("game");
  setOwl("idle");
  newQuestion();
}

const qSig = q => q.mode+':'+q.item.name;
function newQuestion(){
  let q; for(let a=0;a<15;a++){ q=genQuestion(mode); if(!q || !prevSig || qSig(q)!==prevSig) break; }
  if(!q){ flash("Couldn't load the capitals data. This game needs to be served over http(s), not opened as a local file.", 'bad'); return; }
  Q=q; prevSig=qSig(Q); phase='play';

  $("place").textContent = Q.item.name;
  if(mode==="world"){
    $("flag-wrap").classList.remove("hide");
    $("india-badge").classList.add("hide");
    const emoji = flagEmoji(Q.item.iso2);
    $("flag-emoji").textContent = emoji;
    $("flag-emoji").style.display = "";
    const img = $("flag-img");
    img.style.display="none";
    img.onload = ()=>{ img.style.display="block"; $("flag-emoji").style.display="none"; };
    img.onerror = ()=>{ img.style.display="none"; $("flag-emoji").style.display=""; };
    img.src = `https://flagcdn.com/w320/${String(Q.item.iso2).toLowerCase()}.png`;
  } else {
    $("flag-wrap").classList.add("hide");
    $("india-badge").classList.remove("hide");
  }

  const box=$("options"); box.innerHTML="";
  Q.options.forEach((cap,idx)=>{
    const b=document.createElement("button");
    b.className="opt"; b.dataset.idx=idx;
    b.innerHTML=`<span class="num">${idx+1}</span><span>${cap}</span>`;
    b.onclick=()=>answer(idx,b);
    box.appendChild(b);
  });

  $("result-view").classList.add("hide"); $("serve-view").classList.remove("hide");
  $("next-btn").classList.add("invisible"); $("skip-btn").classList.remove("invisible"); $("hint-link").classList.remove("off");
  $("fact").textContent=""; $("fact").classList.remove("show");
  flash("Pick the capital city!", '');
  setOwl('idle');
}

function answer(idx, btn){
  if(phase!=='play') return;
  if(idx===Q.correctIdx){
    phase='done';
    btn.classList.add("correct"); btn.disabled=true;
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    if(Q.item.fact){ $("fact").textContent = "💡 " + Q.item.fact; $("fact").classList.add("show"); }
    flash('', '');
    $("serve-view").classList.add("hide"); $("result-view").classList.remove("hide");
    $("rlabel").textContent = pickPraise();
    $("skip-btn").classList.add("invisible");   // Next takes its place in the bottom slot; Skip keeps its slot so nothing shifts
    $("next-btn").classList.remove("invisible"); $("next-btn").focus();
    setOwl('win'); sound('good');
    if(!reduceMotion) throwConfetti({ colors:["#2FB37D","#FFCF43","#3FA7E0","#FF6B7A"], count:60, frames:60, size:6, lift:4, spread:4, gravity:.15, vr:.2 });
  } else {
    btn.classList.remove("wrong","wrong-flash"); void btn.offsetWidth; btn.classList.add("wrong","wrong-flash");
    setTimeout(()=>{ btn.classList.remove("wrong-flash","wrong"); btn.classList.add("gone"); btn.disabled=true; }, 350);
    flash(`Not ${Q.options[idx]} — try again!`, 'bad'); setOwl('worried'); sound('bad');
  }
}

function pickPraise(){
  const p=["🎉 Correct!","🌟 Yes! Well done!","👏 That's right!","✨ Brilliant!","🙌 You got it!"];
  return p[rnd(p.length)];
}

function giveHint(){
  if(phase!=='play') return;
  const opts=[...document.querySelectorAll(".opt")];
  const eliminable=opts.filter((b,i)=> i!==Q.correctIdx && !b.disabled);
  if(eliminable.length===0){ flash("Only the right answer is left — go for it!", 'hint'); return; }
  const b=eliminable[rnd(eliminable.length)];
  b.classList.add("gone"); b.disabled=true;
  flash(`💡 It's not ${Q.options[+b.dataset.idx]}.`, 'hint'); setOwl('think');
}

function goHome(){ showHome(); Q=null; }

// keyboard: 1-6 to answer, Enter/Space for next, H hint
document.addEventListener("keydown", e=>{
  if($("screen-quiz").classList.contains("hide") || !Q) return;
  if((e.key==="Enter"||e.key===" ") && phase==='done'){ e.preventDefault(); newQuestion(); return; }
  if(e.key.toLowerCase()==="h" && phase==='play'){ giveHint(); return; }
  const n=parseInt(e.key,10);
  if(!isNaN(n) && n>=1 && n<=Q.options.length && phase==='play'){
    const b=document.querySelector(`.opt[data-idx="${n-1}"]`);
    if(b && !b.disabled) b.click();
  }
});

// ---- sound / confetti (setOwl/beep/stopConfetti are shared in site.js) ----
function sound(kind){
  if(kind==="good"){ beep(660,.12,"triangle"); beep(880,.14,"triangle",.08); }
  else if(kind==="bad"){ beep(200,.22,"sawtooth",0,.12); }
}

initBouncyTitle("Guess the Capital");
setMode("india");
</script>
</body>
</html>
