  .instruct{text-align:center; font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink-soft);

  .board-wrap{background:var(--wood-bg); border:3px solid var(--wood-line); border-radius:20px;

  .board{width:100%; height:auto; max-width:560px; touch-action:manipulation; display:block; margin:0 auto;}
  .hit{cursor:pointer;}
  .hit.locked{cursor:default;}
  .target{animation:tpulse 1.1s ease-in-out infinite;}
  @keyframes tpulse{0%,100%{opacity:.35}50%{opacity:.85}}
  .target-sunk-shadow{opacity:.3;}
  .target-sunk-hi{opacity:.6;}
  .hint-from{animation:hpulseA 1s ease-in-out infinite;}
  .hint-to{animation:hpulseB 1s ease-in-out infinite;}
  @keyframes hpulseA{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes hpulseB{0%,100%{opacity:.3}50%{opacity:.9}}
  .controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px;}
  .overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:18px;
    background:rgba(51,35,107,.45); backdrop-filter:blur(3px);}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:26px; box-shadow:var(--shadow); padding:30px 28px; max-width:440px;

  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .modal h2{font-family:'Fredoka',sans-serif; font-size:28px; margin:10px 0 2px;}

  .modal .stars{font-size:30px; letter-spacing:4px; margin:4px 0 8px;}
  .modal p{color:var(--ink-soft); font-weight:700; margin:6px 0 18px;}

<script>
"use strict";
const rnd = n => Math.floor(Math.random()*n);

/* ============================================================
   MATCHSTICK GEOMETRY  (all sticks are length ~60, in viewBox units)
   Seven-segment digits + operator/equals cells.
   ============================================================ */
const CELL_W = 76, GAP = 16, VH = 170, INSET = 7;
const HIT_W = 30;        // invisible line width (viewBox units) — just mouse-hover affordance now
const CAPTURE_PX = 26;   // real on-screen pixel radius a tap must land within a stick's centreline to select it

// digit segment endpoints (local to a 76-wide cell)
const DIGIT_SEGS = {
  a:[8,25,68,25], b:[68,25,68,85], c:[68,85,68,145],
  d:[8,145,68,145], e:[8,85,8,145], f:[8,25,8,85], g:[8,85,68,85]
};
// which segments are lit for each digit
const DIGIT_ON = {
  '0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg',
  '5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg'
};
// reverse: sorted segment string -> digit
const SEG2DIGIT = {};
for(const d in DIGIT_ON){ SEG2DIGIT[DIGIT_ON[d].split('').sort().join('')] = d; }

const OP_SEGS  = { h:[8,85,68,85], v:[38,55,38,115] };        // + = h & v ; - = h only
const OPX_SEGS = { p:[16.8,63.8,59.2,106.2], q:[16.8,106.2,59.2,63.8] }; // fixed X
const EQ_SEGS  = { t:[8,65,68,65], b:[8,105,68,105] };        // fixed =

/* ============================================================
   BOARD MODEL
   ============================================================ */
let cells = [];        // [{type,digit?,op?,x}]
let slots = [];        // [{id,ci,seg,x1,y1,x2,y2,fixed}]
let slotById = {};
let fixed = new Set(); // slot ids that never move
let filled = new Set();// slot ids currently holding a stick
let boardW = 0;

function tokensToCells(tokens){
  const c=[];
  for(const tok of tokens){
    if(/^\d$/.test(tok)) c.push({type:'digit', digit:tok});
    else if(tok==='+'||tok==='-') c.push({type:'op', op:tok});
    else if(tok==='*') c.push({type:'opx'});
    else if(tok==='=') c.push({type:'eq'});
  }
  return c;
}

// build slots + the "true" filled set for the given cells
function layout(cellsIn){
  cells = cellsIn; slots=[]; slotById={}; fixed=new Set();
  const trueFilled = new Set();
  let x=0;
  cells.forEach((cell,ci)=>{
    cell.x = x;
    const add = (seg,coords,isFixed)=>{
      const s={id:ci+'-'+seg, ci, seg, x1:coords[0]+x, y1:coords[1], x2:coords[2]+x, y2:coords[3], fixed:!!isFixed};
      slots.push(s); slotById[s.id]=s; if(isFixed) fixed.add(s.id);
    };
    if(cell.type==='digit'){
      for(const seg in DIGIT_SEGS) add(seg, DIGIT_SEGS[seg], false);
      for(const seg of DIGIT_ON[cell.digit]) trueFilled.add(ci+'-'+seg);
    } else if(cell.type==='op'){
      for(const seg in OP_SEGS) add(seg, OP_SEGS[seg], false);
      trueFilled.add(ci+'-h'); if(cell.op==='+') trueFilled.add(ci+'-v');
    } else if(cell.type==='opx'){
      for(const seg in OPX_SEGS){ add(seg, OPX_SEGS[seg], true); trueFilled.add(ci+'-'+seg); }
    } else if(cell.type==='eq'){
      for(const seg in EQ_SEGS){ add(seg, EQ_SEGS[seg], true); trueFilled.add(ci+'-'+seg); }
    }
    x += CELL_W + GAP;
  });
  boardW = x - GAP;
  return trueFilled;
}

/* ============================================================
   DECODING / EVALUATION
   ============================================================ */
function decodeCell(cell, ci, F){
  if(cell.type==='digit'){
    let s=''; for(const seg of 'abcdefg') if(F.has(ci+'-'+seg)) s+=seg;
    if(s==='') return null;
    const key = s.split('').sort().join('');
    return (key in SEG2DIGIT) ? SEG2DIGIT[key] : null;
  }
  if(cell.type==='op'){
    const h=F.has(ci+'-h'), v=F.has(ci+'-v');
    if(h&&v) return '+'; if(h&&!v) return '-'; return null;
  }
  if(cell.type==='opx') return '*';
  if(cell.type==='eq') return '=';
  return null;
}

function evalExprSafe(t){
  if(t.length===0 || t.length%2===0) return null;
  for(let i=0;i<t.length;i++){
    if(i%2===0){ if(!/^\d+$/.test(t[i])) return null; if(t[i].length>1 && t[i][0]==='0') return null; }
    else { if(!['+','-','*'].includes(t[i])) return null; }
  }
  const stack=[parseInt(t[0],10)]; const ops=[];
  for(let i=1;i<t.length;i+=2){
    const op=t[i], n=parseInt(t[i+1],10);
    if(op==='*') stack[stack.length-1]*=n; else { ops.push(op); stack.push(n); }
  }
  let r=stack[0];
  for(let k=0;k<ops.length;k++) r = ops[k]==='+' ? r+stack[k+1] : r-stack[k+1];
  return r;
}

// returns {valid, ok, display}
function decodeEquation(F){
  const tokens=[]; let cur='';
  for(let ci=0;ci<cells.length;ci++){
    const d=decodeCell(cells[ci],ci,F);
    if(d===null) return {valid:false};
    if(/[0-9]/.test(d)) cur+=d;
    else { if(cur!==''){ tokens.push(cur); cur=''; } tokens.push(d); }
  }
  if(cur!=='') tokens.push(cur);
  const eqs=tokens.filter(x=>x==='=').length;
  if(eqs!==1) return {valid:false};
  const ei=tokens.indexOf('=');
  const L=tokens.slice(0,ei), R=tokens.slice(ei+1);
  const lv=evalExprSafe(L), rv=evalExprSafe(R);
  if(lv===null||rv===null) return {valid:false};
  return {valid:true, ok: lv===rv, display: tokens.join('').replace(/\*/g,'×')};
}

/* ============================================================
   MOVES + GENERATION  (guaranteed solvable)
   ============================================================ */
// all single-stick relocations from a filled set
function singleMoves(F){
  const out=[];
  const empties = slots.filter(s=>!s.fixed && !F.has(s.id)).map(s=>s.id);
  for(const s of slots){
    if(s.fixed || !F.has(s.id)) continue;      // must be a moveable stick present
    for(const to of empties){
      if(to===s.id) continue;
      const g=new Set(F); g.delete(s.id); g.add(to);
      out.push({from:s.id, to, set:g});
    }
  }
  return out;
}

// any single move that makes the current board TRUE (for hints / safety)
function findSolution(F){
  for(const m of singleMoves(F)){
    const dec=decodeEquation(m.set);
    if(dec.valid && dec.ok) return m;
  }
  return null;
}

function num(n){ return String(n).split(''); }

function makeTrue(level){
  const build = (a,op,b)=> num(a).concat(op, num(op==='+'?a+b:op==='-'?a-b:a*b));
  const eq = (arr,res)=> arr.concat('=', num(res));
  if(level==='EASY'){
    if(Math.random()<0.5){ const a=1+rnd(9), b=1+rnd(9); return eq(num(a).concat('+',num(b)), a+b); }
    const a=2+rnd(8), b=1+rnd(a-1); return eq(num(a).concat('-',num(b)), a-b);
  }
  if(level==='MEDIUM'){
    if(Math.random()<0.5){ const a=2+rnd(30), b=2+rnd(30); if(a+b>99) return makeTrue(level); return eq(num(a).concat('+',num(b)), a+b); }
    const a=10+rnd(60), b=1+rnd(a-1); return eq(num(a).concat('-',num(b)), a-b);
  }
  if(level==='HARD'){
    const t=rnd(3);
    if(t===0){ const a=2+rnd(8), b=2+rnd(8); return eq(num(a).concat('*',num(b)), a*b); }
    if(t===1){ const a=5+rnd(40), b=5+rnd(40); if(a+b>99) return makeTrue(level); return eq(num(a).concat('+',num(b)), a+b); }
    const a=20+rnd(70), b=5+rnd(a-5); if(a>99) return makeTrue(level); return eq(num(a).concat('-',num(b)), a-b);
  }
  // EXPERT
  const t=rnd(3);
  if(t===0){ const a=3+rnd(7), b=3+rnd(7); return eq(num(a).concat('*',num(b)), a*b); }
  if(t===1){ const a=15+rnd(70), b=15+rnd(70); if(a+b>99) return makeTrue('EXPERT'); return eq(num(a).concat('+',num(b)), a+b); }
  const a=30+rnd(69), b=11+rnd(a-11); if(a>99||b>=a) return makeTrue('EXPERT'); return eq(num(a).concat('-',num(b)), a-b);
}

// produce a FALSE board one stick-move away from a TRUE one
function generatePuzzle(level){
  for(let tries=0; tries<400; tries++){
    const tokens = makeTrue(level);
    const trueFilled = layout(tokensToCells(tokens));
    // sanity: the "true" board really is true
    const base = decodeEquation(trueFilled);
    if(!base.valid || !base.ok) continue;
    // candidate reverse moves -> valid but FALSE boards
    const cands=[];
    for(const m of singleMoves(trueFilled)){
      const dec=decodeEquation(m.set);
      if(dec.valid && !dec.ok) cands.push(m);
    }
    if(!cands.length) continue;
    const pick = cands[rnd(cands.length)];
    // puzzle board = the false state; ensure it still has a solution (it does: reverse pick)
    filled = new Set(pick.set);
    return { start: new Set(pick.set) };
  }
  // extremely unlikely fallback
  const trueFilled = layout(tokensToCells(['2','+','2','=','4']));
  filled = new Set(trueFilled); filled.delete(cells.length? '0-a':'0-a');
  return { start: new Set(filled) };
}

/* ============================================================
   RENDERING
   ============================================================ */
function insetPts(x1,y1,x2,y2,i){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  return [x1+ux*i, y1+uy*i, x2-ux*i, y2-uy*i];
}
function lineEl(cls, coords, extra){
  const [x1,y1,x2,y2]=coords;
  return `<line class="${cls}" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" ${extra||''}/>`;
}
// the little coloured "match head" bead at one end of a drawn stick, so it reads as a matchstick and not a plain rod
function headEl(coords){
  const [,,x2,y2]=coords;
  return `<circle class="matchhead" cx="${x2.toFixed(2)}" cy="${y2.toFixed(2)}" r="8" fill="url(#matchhead)" stroke="#7a231b" stroke-width="1.2"/>`;
}
// a quiet, engraved-looking groove for "you could place a stick here" slots —
// a dark offset stroke plus a light offset stroke, so it reads as sunken rather than a bright overlay
function sunkenTargetGhost(coords){
  const [x1,y1,x2,y2]=coords;
  const horiz = y1===y2;
  const ox = horiz?0:1, oy = horiz?1:0;
  return lineEl('slotghost target-sunk-shadow', [x1+ox,y1+oy,x2+ox,y2+oy], 'stroke="#9c7a45" stroke-width="8" stroke-linecap="round"')
       + lineEl('slotghost target-sunk-hi', [x1-ox,y1-oy,x2-ox,y2-oy], 'stroke="#ffffff" stroke-width="6" stroke-linecap="round"');
}

// interaction state
let held = null;        // slot id currently "in hand" (its origin), or null
let moved = null;       // {from,to} once a stick has been relocated, or null
let solvedFlag = false;
let hintMove = null;    // {from,to} to highlight
let hitCandidates = []; // [{id,act,pts}] mirrors the invisible hit lines, for distance-based tap resolution

function render(){
  const svg=$("board");
  svg.setAttribute("viewBox", `0 0 ${boardW} ${VH}`);
  const wood=[], ghost=[], hits=[];
  hitCandidates = [];

  for(const s of slots){
    const on = filled.has(s.id);
    const isHeldOrigin = (held===s.id);
    const isHintFrom = hintMove && hintMove.from===s.id;
    const isHintTo   = hintMove && hintMove.to===s.id;

    // ---- decide visual + action ----
    if(s.fixed){
      const pts=insetPts(s.x1,s.y1,s.x2,s.y2,INSET);
      wood.push(lineEl('stick fixed', pts, 'stroke="url(#woodFixed)" stroke-width="12" stroke-linecap="round"'));
      wood.push(headEl(pts));
      { const hp=insetPts(s.x1,s.y1,s.x2,s.y2,2);
        hits.push(lineEl('hit locked', hp, `stroke="transparent" stroke-width="${HIT_W}" data-act="fixed"`));
        hitCandidates.push({id:s.id, act:'fixed', pts:hp}); }
      continue;
    }
    if(isHeldOrigin){
      // the empty hole where the in-hand stick came from (tap to cancel)
      ghost.push(lineEl('slotghost origin', insetPts(s.x1,s.y1,s.x2,s.y2,INSET), 'stroke="var(--grape)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.55"'));
      { const hp=insetPts(s.x1,s.y1,s.x2,s.y2,2);
        hits.push(lineEl('hit', hp, `stroke="transparent" stroke-width="${HIT_W}" data-act="cancel" data-id="${s.id}"`));
        hitCandidates.push({id:s.id, act:'cancel', pts:hp}); }
      continue;
    }
    if(on){
      let cls='stick', act='lift', locked=false;
      if(moved && held===null && s.id!==moved.to){ act='blocked'; locked=true; } // only the moved stick may be re-lifted
      if(isHintFrom) cls+=' hint-from';
      const pts=insetPts(s.x1,s.y1,s.x2,s.y2,INSET);
      wood.push(lineEl(cls, pts, 'stroke="url(#wood)" stroke-width="12" stroke-linecap="round"'));
      wood.push(headEl(pts));
      { const hp=insetPts(s.x1,s.y1,s.x2,s.y2,2);
        hits.push(lineEl('hit'+(locked?' locked':''), hp, `stroke="transparent" stroke-width="${HIT_W}" data-act="${act}" data-id="${s.id}"`));
        hitCandidates.push({id:s.id, act, pts:hp}); }
      continue;
    }
    // empty non-fixed slot
    if(held!==null){
      if(isHintTo){
        ghost.push(lineEl('slotghost target hint-to', insetPts(s.x1,s.y1,s.x2,s.y2,INSET), 'stroke="var(--sun-dark)" stroke-width="11" stroke-linecap="round"'));
      } else {
        ghost.push(sunkenTargetGhost(insetPts(s.x1,s.y1,s.x2,s.y2,INSET)));
      }
      { const hp=insetPts(s.x1,s.y1,s.x2,s.y2,2);
        hits.push(lineEl('hit', hp, `stroke="transparent" stroke-width="${HIT_W}" data-act="place" data-id="${s.id}"`));
        hitCandidates.push({id:s.id, act:'place', pts:hp}); }
    } else if(isHintTo){
      ghost.push(lineEl('slotghost hint-to', insetPts(s.x1,s.y1,s.x2,s.y2,INSET), 'stroke="var(--sun-dark)" stroke-width="11" stroke-linecap="round"'));
    }
  }

  svg.innerHTML = `
    <defs>
      <linearGradient id="wood" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${VH}">
        <stop offset="0" stop-color="#F0C07E"/><stop offset="0.5" stop-color="#DB9A44"/><stop offset="1" stop-color="#B5761F"/>
      </linearGradient>
      <linearGradient id="woodFixed" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${VH}">
        <stop offset="0" stop-color="#C9B79B"/><stop offset="1" stop-color="#9C8968"/>
      </linearGradient>
      <radialGradient id="matchhead" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#FF7A6E"/>
        <stop offset="55%" stop-color="#E1493C"/>
        <stop offset="100%" stop-color="#9c2a20"/>
      </radialGradient>
      <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#7a4a10" flood-opacity="0.28"/>
      </filter>
    </defs>
    <g>${ghost.join('')}</g>
    <g filter="url(#ds)">${wood.join('')}</g>
    <g>${hits.join('')}</g>
  `;
}

/* ============================================================
   INTERACTION
   ============================================================ */
// maps a click/tap to SVG viewBox coordinates, plus the current px-per-unit scale
function svgPoint(e){
  const svg=$("board");
  const rect=svg.getBoundingClientRect();
  const scale = rect.width ? boardW/rect.width : 1; // viewBox units per CSS px
  const src = (e.changedTouches && e.changedTouches[0]) || e;
  return { x:(src.clientX-rect.left)*scale, y:(src.clientY-rect.top)*scale, scale };
}
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, len2=dx*dx+dy*dy;
  let t = len2 ? ((px-x1)*dx+(py-y1)*dy)/len2 : 0;
  t = Math.max(0, Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function onBoardClick(e){
  if(solvedFlag) return;
  const p = svgPoint(e);
  // pick whichever stick's centreline the tap actually landed closest to — not whichever
  // invisible hit-band happens to be on top, since crossing sticks (the "+" sign) overlap heavily
  let best=null, bestDist=Infinity;
  for(const c of hitCandidates){
    const [x1,y1,x2,y2]=c.pts;
    const d=distToSeg(p.x,p.y,x1,y1,x2,y2);
    if(d<bestDist){ bestDist=d; best=c; }
  }
  if(!best || bestDist > CAPTURE_PX*p.scale) return;
  const act = best.act;
  const id  = best.id;
  hintMove = null; // any interaction clears hint highlight

  if(act==='fixed'){ flash("That sign is glued down — it can't move!", 'hint'); setOwl('think'); return; }

  if(held===null){
    if(act==='lift'){
      // begin a move (fresh) OR re-lift the already-moved stick
      const origin = (moved && id===moved.to) ? moved.from : id;
      filled.delete(id);
      held = origin;
      moved = null;
      sound('tick');
      render();
    } else if(act==='blocked'){
      flash("Only one stick can move. Tap 🔄 Reset to try another.", 'hint');
      setOwl('think');
    }
    return;
  }

  // a stick is in hand
  if(act==='cancel'){                 // tapped the origin hole -> put it back
    filled.add(held); held=null; sound('tick'); render(); return;
  }
  if(act==='place'){
    filled.add(id);
    moved = { from: held, to: id };
    held = null;
    sound('tick');
    render();
    completeMove();
  }
}

function completeMove(){
  const dec = decodeEquation(filled);
  if(dec.valid && dec.ok){ onSolved(dec); return; }
  if(!dec.valid){
    flash("Hmm, that doesn't make a real number. Try a different spot!", 'bad');
  } else {
    flash("Not right yet — pick the stick up again, or tap 🔄 Reset.", 'bad');
  }
  setOwl('worried'); sound('bad');
}

function onSolved(dec){
  solvedFlag=true;
  flash('', '');
  $("serve-view").classList.add("hide"); $("result-view").classList.remove("hide");
  $("rlabel").textContent = "🎉 Correct! " + dec.display + "  " + praise();
  $("skip-btn").classList.add("invisible");   // Next takes its place in the bottom slot; Skip keeps its slot so nothing shifts
  $("next-btn").classList.remove("hide"); $("next-btn").focus();
  setOwl('win'); sound('win');
  if(!reduceMotion) miniConfetti();
  render();
}

function praise(){
  const p=["🎉","🌟","Nice thinking! ✨","Brilliant! 👏","You fixed it! 🙌","Sharp eyes! 👀"];
  return p[rnd(p.length)];
}
/* ============================================================
   SESSION
   ============================================================ */
let level="EASY", game=null, prevSig=null;
const LEVEL_LABEL = { EASY:"🌱 Easy", MEDIUM:"⭐ Medium", HARD:"🔥 Hard", EXPERT:"🏆 Expert" };

function setLevel(l){
  level=l;
  document.querySelectorAll(".diff").forEach(b=>b.setAttribute("aria-pressed", b.dataset.diff===l));
  const lbl=$("q-level-label"); if(lbl) lbl.textContent=LEVEL_LABEL[l];
  document.querySelectorAll(".level-opt").forEach(b=>b.setAttribute("aria-current", b.dataset.diff===l));
}
document.querySelectorAll(".diff").forEach(b=> b.onclick=()=>setLevel(b.dataset.diff));

// level switcher (tap the chip at the top to change difficulty mid-game)
(function buildLevelMenu(){
  const menu=$("level-menu");
  menu.innerHTML=Object.entries(LEVEL_LABEL).map(([k,v])=>
    `<button class="level-opt" role="menuitemradio" data-diff="${k}" aria-current="false"><span>${v}</span><span class="tick">✓</span></button>`).join('');
  menu.querySelectorAll(".level-opt").forEach(b=> b.onclick=()=>pickLevel(b.dataset.diff));
})();
function pickLevel(l){ closeLevelMenu(); if(l===level) return; setLevel(l); newPuzzle(); }
wireLevelMenu();

$("start-btn").onclick = startSession;
$("home-btn").onclick  = goHome;
$("next-btn").onclick   = newPuzzle;
$("reset-btn").onclick  = ()=>{ if(solvedFlag) return; filled=new Set(game.start); held=null; moved=null; hintMove=null;
  flash("Board reset. Move one stick to fix it.", ''); setOwl('idle'); render(); };
$("skip-btn").onclick   = ()=>{ if(solvedFlag) return; newPuzzle(); };
$("hint-btn").onclick   = giveHint;
$("board").addEventListener('click', onBoardClick);

function startSession(){
  game = { usedHint:false, start:null };
  setLevel(level);
  $("screen-home").classList.add("hide");
  $("screen-game").classList.remove("hide");
  setOwl('idle');
  newPuzzle();
}

const puzzleSig = start => Array.from(start).sort().join(',');
function newPuzzle(){
  solvedFlag=false; held=null; moved=null; hintMove=null; game.usedHint=false;
  // fresh puzzle, different from the one just shown (Skip/Next never repeat the current puzzle)
  let r; for(let a=0;a<15;a++){ r=generatePuzzle(level); if(!prevSig || puzzleSig(r.start)!==prevSig) break; }
  game.start = new Set(r.start);
  prevSig = puzzleSig(game.start);
  $("serve-view").classList.remove("hide"); $("result-view").classList.add("hide");
  $("next-btn").classList.add("hide"); $("skip-btn").classList.remove("invisible");
  flash("This sum is wrong. Move ONE stick to fix it!", '');
  $("instruct").textContent = "Tap a stick, then tap a glowing spot.";
  setOwl('idle');
  render();
}

function giveHint(){
  if(solvedFlag) return;
  // reset any in-progress move so the hint refers to the puzzle's own start
  filled=new Set(game.start); held=null; moved=null;
  const sol = findSolution(filled);
  if(!sol){ flash("This one's a real puzzler — try any single move!", 'hint'); render(); return; }
  hintMove = { from: sol.from, to: sol.to };
  game.usedHint=true;
  flash("💡 Take the glowing stick and move it to the glowing spot.", 'hint');
  setOwl('think');
  render();
}

function goHome(){
  stopConfetti();
  $("screen-game").classList.add("hide");
  $("screen-home").classList.remove("hide");
  setOwl('idle');
}

// keyboard: Escape reset, H hint, Enter/Space -> next (when solved), Escape also closes the level menu
document.addEventListener("keydown", e=>{
  if(e.key==='Escape'){ closeLevelMenu(); }
  if($("screen-game").classList.contains("hide")) return;
  if(!game) return;
  if((e.key==="Enter"||e.key===" ") && solvedFlag){ e.preventDefault(); newPuzzle(); }
  else if(e.key==="Escape" && !solvedFlag){ e.preventDefault(); $("reset-btn").click(); }
  else if(e.key.toLowerCase()==="h" && !solvedFlag){ $("hint-btn").click(); }
});

/* ============================================================
   SOUND / CONFETTI / TITLE  (beep/stopConfetti/initBouncyTitle are shared in site.js)
   ============================================================ */
function sound(kind){
  if(kind==="tick"){ beep(520,.05,"square",0,.06); }
  else if(kind==="good"){ beep(660,.12,"triangle"); beep(880,.14,"triangle",.08); }
  else if(kind==="bad"){ beep(200,.22,"sawtooth",0,.12); }
  else if(kind==="win"){ [523,659,784,1047].forEach((f,i)=>beep(f,.18,"triangle",i*.10)); }
}

function launchConfetti(){
  const cv=$("confetti"); cv.style.display="block"; const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const colors=["#6C4AB6","#FF6B7A","#2FB37D","#FFCF43","#3FA7E0","#DB9A44"];
  const parts=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
    r:5+Math.random()*7,c:colors[Math.floor(Math.random()*colors.length)],vy:2+Math.random()*3,
    vx:-1.5+Math.random()*3,rot:Math.random()*6,vr:-.2+Math.random()*.4}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    f++; if(f<220) confettiRAF=requestAnimationFrame(draw); else stopConfetti();})();
}
function miniConfetti(){
  const cv=$("confetti"); cv.style.display="block"; const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const colors=["#2FB37D","#FFCF43","#3FA7E0","#FF6B7A","#DB9A44"];
  const parts=Array.from({length:46},()=>({x:cv.width/2,y:cv.height*0.35,r:5+Math.random()*6,
    c:colors[Math.floor(Math.random()*colors.length)],vy:-4+Math.random()*2,vx:-4+Math.random()*8,rot:0,vr:.2}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    f++; if(f<60) requestAnimationFrame(draw); else stopConfetti();})();
}

initBouncyTitle("Matchstick Math");
setLevel("EASY");
</script>
