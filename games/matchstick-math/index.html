<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matchstick Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky-top:#A8E0FF; --sky-bot:#D9F6E4;
    --ink:#33236B; --ink-soft:#6a5aa0;
    --grape:#6C4AB6; --grape-dark:#553a95;
    --sun:#FFCF43; --sun-dark:#e6a800;
    --coral:#FF6B7A; --coral-dark:#e24a5c;
    --leaf:#2FB37D; --leaf-dark:#218a60;
    --sky:#3FA7E0; --sky-dark:#2b86ba;
    --card:#FFFFFF; --key-line:#E4DCF5;
    --wood-bg:#FBF3E4; --wood-line:#EAD9BC;
    --shadow:0 18px 40px rgba(72,45,130,.18);
    --radius:26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif; color:var(--ink); min-height:100vh; min-height:100dvh;
    background:linear-gradient(180deg,var(--sky-top) 0%,#C6ECEC 45%,var(--sky-bot) 100%);
    background-attachment:fixed;
    display:flex; align-items:flex-start; justify-content:center; padding:22px 14px 60px;
  }
  body::before,body::after{
    content:""; position:fixed; z-index:0; border-radius:50%;
    background:rgba(255,255,255,.55); filter:blur(1px);
    box-shadow:60px 10px 0 -6px rgba(255,255,255,.55), 120px 4px 0 -10px rgba(255,255,255,.5);
  }
  body::before{width:90px;height:34px;top:8%;left:6%;}
  body::after{width:70px;height:26px;top:16%;right:10%;}

  .app{position:relative; z-index:1; width:100%; max-width:720px;}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px;}

  .brand{display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:4px;}
  .title{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(28px,5.5vw,42px);
    line-height:1; margin:0; text-align:center;}
  .title .c1{color:var(--grape);} .title .c2{color:var(--coral);}
  .title .c3{color:var(--leaf);} .title .c4{color:var(--sun-dark);}
  .subtitle{text-align:center; color:var(--ink-soft); font-weight:700; margin:2px 0 18px; font-size:15px;}

  /* owl */
  .owl{width:60px; height:60px; flex:0 0 auto;}
  .owl .pupil{transition:transform .2s ease;}
  .owl .brow{transition:transform .2s ease; transform-origin:center;}
  .owl.think .pupil{transform:translateY(2px);}
  .owl.worried .brow-l{transform:rotate(14deg) translateY(-1px);}
  .owl.worried .brow-r{transform:rotate(-14deg) translateY(-1px);}
  .owl.happy .beak,.owl.win .beak{transform:translateY(1px) scale(1.05);}

  /* buttons */
  .btn{font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px; border:none; cursor:pointer;
    color:#fff; border-radius:16px; padding:13px 22px; position:relative;
    transition:transform .06s ease, filter .15s ease; box-shadow:0 5px 0 var(--btn-shadow,#0003); user-select:none;}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--btn-shadow,#0003);}
  .btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px;}
  .btn-primary{background:var(--grape); --btn-shadow:var(--grape-dark);}
  .btn-go{background:var(--leaf); --btn-shadow:var(--leaf-dark);}
  .btn-warn{background:var(--coral); --btn-shadow:var(--coral-dark);}
  .btn-sun{background:var(--sun); color:var(--ink); --btn-shadow:var(--sun-dark);}
  .btn-ghost{background:#F1EDFA; color:var(--grape); --btn-shadow:#d9d0ef;}
  .btn:disabled{filter:grayscale(.4) opacity(.5); cursor:not-allowed;}
  .btn-lg{font-size:20px; padding:16px 34px;}
  .btn-sm{font-size:15px; padding:10px 15px; border-radius:13px;}

  .block-label{font-family:'Fredoka',sans-serif; font-weight:600; color:var(--grape); font-size:15px;
    text-transform:uppercase; letter-spacing:1px; margin:20px 0 10px;}

  /* level grid (shared look with sibling games) */
  .diff-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media(min-width:560px){.diff-grid{grid-template-columns:repeat(4,1fr);}}
  .diff{border:3px solid #EEE8FB; background:#fff; border-radius:18px; cursor:pointer; padding:14px 10px;
    text-align:center; transition:all .15s ease;}
  .diff:focus-visible{outline:3px solid var(--grape); outline-offset:2px;}
  .diff .d-name{font-family:'Fredoka',sans-serif; font-weight:600; font-size:19px;}
  .diff .d-range{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-top:3px;}
  .diff[aria-pressed="true"]{border-color:var(--dc,var(--grape)); background:var(--dbg,#F4F0FE);
    transform:translateY(-2px); box-shadow:var(--shadow);}
  .diff.easy{--dc:var(--leaf); --dbg:#E8F8F0;}
  .diff.medium{--dc:var(--sky); --dbg:#E6F4FC;}
  .diff.hard{--dc:var(--sun-dark); --dbg:#FFF6DC;}
  .diff.expert{--dc:var(--coral); --dbg:#FFEAED;}

  .seg{display:flex; gap:8px; background:#F1EDFA; padding:6px; border-radius:16px; max-width:320px; margin:0 auto;}
  .seg button{flex:1; border:none; background:transparent; cursor:pointer; font-family:'Fredoka',sans-serif;
    font-weight:600; font-size:16px; color:var(--ink-soft); padding:11px 6px; border-radius:11px;}
  .seg button[aria-pressed="true"]{background:#fff; color:var(--grape); box-shadow:0 3px 10px rgba(108,74,182,.2);}
  .seg button:focus-visible{outline:3px solid var(--grape); outline-offset:2px;}

  .howto{background:#F4F0FE; border-radius:16px; padding:14px 16px; margin-top:18px; font-weight:700;
    color:var(--ink-soft); font-size:14px; line-height:1.5;}
  .howto b{color:var(--grape);}
  .center{text-align:center;} .mt{margin-top:22px;}
  .row-btns{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}

  .home-top{display:flex; margin-bottom:4px;}
  .hub-link{font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--grape); text-decoration:none; opacity:.8;}
  .hub-link:hover{opacity:1; text-decoration:underline;}

  /* game top bar */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:22px;}
  .topbar .tb-center{display:flex; align-items:center; gap:8px; min-width:0;}
  .topbar .tb-right{display:flex; align-items:center; gap:8px;}
  .chip{font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:#fff; background:var(--grape);
    padding:6px 14px; border-radius:999px;}

  /* text-link controls (Home / Skip / Next / Reset / Hint) — look like links, not buttons */
  .tlink{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; color:var(--grape); background:none; border:none;
    cursor:pointer; text-decoration:none; padding:6px 6px; display:inline-flex; align-items:center; gap:5px; opacity:.82;}
  .tlink:hover{opacity:1;} .tlink.off{opacity:.32; pointer-events:none;}
  .tlink:focus-visible{outline:3px solid var(--grape); outline-offset:2px; border-radius:10px;}
  .actions{display:flex; gap:22px; justify-content:center; align-items:center; margin:12px 0 18px;}
  .serve-row{display:flex; justify-content:center; margin-top:6px;}
  .invisible{visibility:hidden !important;}  /* hidden but keeps its space, so the top bar doesn't reflow */

  .level-switch{position:relative; display:inline-block;}
  .chip.level{cursor:pointer; user-select:none; border:none; display:inline-flex; align-items:center; gap:5px;}
  .chip.level:hover{filter:brightness(1.07);} .chip.level .caret{font-size:10px; opacity:.85;}
  .chip.level:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .level-menu{position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:40;
    background:#fff; border:2px solid var(--key-line); border-radius:14px; box-shadow:var(--shadow); padding:6px; min-width:160px; display:none;}
  .level-menu.open{display:block;}
  .level-opt{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; color:var(--ink); background:none; border:none; cursor:pointer; padding:9px 12px; border-radius:10px; white-space:nowrap;}
  .level-opt:hover{background:#F4F0FE;} .level-opt[aria-current="true"]{background:#F1EDFA; color:var(--grape);}
  .level-opt .tick{color:var(--leaf-dark); font-weight:700; opacity:0;} .level-opt[aria-current="true"] .tick{opacity:1;}

  .instruct{text-align:center; font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink-soft);
    font-size:15px; margin:0 0 14px;}

  /* the matchstick board */
  .board-wrap{background:var(--wood-bg); border:3px solid var(--wood-line); border-radius:20px;
    padding:20px 14px; margin:0 auto 18px; text-align:center;
    box-shadow:inset 0 3px 14px rgba(140,100,40,.12);}
  .board{width:100%; height:auto; max-width:560px; touch-action:manipulation; display:block; margin:0 auto;}
  .hit{cursor:pointer;}
  .hit.locked{cursor:default;}
  .target{animation:tpulse 1.1s ease-in-out infinite;}
  @keyframes tpulse{0%,100%{opacity:.35}50%{opacity:.85}}
  .target-sunk-shadow{opacity:.3;}
  .target-sunk-hi{opacity:.6;}
  .hint-from{animation:hpulseA 1s ease-in-out infinite;}
  .hint-to{animation:hpulseB 1s ease-in-out infinite;}
  @keyframes hpulseA{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes hpulseB{0%,100%{opacity:.3}50%{opacity:.9}}

  .feedback{min-height:22px; text-align:center; font-family:'Nunito',sans-serif; font-weight:700;
    font-size:14px; margin:14px 0 12px;}
  .feedback.good{color:var(--leaf-dark);} .feedback.bad{color:var(--coral-dark);}
  .feedback.hint{color:var(--sun-dark);}
  .result{text-align:center; padding:8px 4px 16px;}
  .result .rlabel{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(20px,5vw,26px); color:var(--leaf-dark);}

  .controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px;}

  /* overlay */
  .overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:18px;
    background:rgba(51,35,107,.45); backdrop-filter:blur(3px);}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:26px; box-shadow:var(--shadow); padding:30px 28px; max-width:440px;
    width:100%; text-align:center; animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .modal h2{font-family:'Fredoka',sans-serif; font-size:28px; margin:10px 0 2px;}
  .modal .big-face{font-size:56px; line-height:1;}
  .modal .score-line{font-family:'Fredoka',sans-serif; font-weight:700; font-size:34px; color:var(--grape); margin:8px 0;}
  .modal .stars{font-size:30px; letter-spacing:4px; margin:4px 0 8px;}
  .modal p{color:var(--ink-soft); font-weight:700; margin:6px 0 18px;}

  canvas#confetti{position:fixed; inset:0; z-index:60; pointer-events:none; display:none;}
  .hide{display:none !important;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="card">

    <!-- ===== HOME ===== -->
    <section id="screen-home">
      <div class="home-top"><a class="hub-link" href="../">← All games</a></div>
      <div class="brand">
        <svg class="owl" id="owl-home" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M14 10 L22 20 L10 20 Z" fill="#6C4AB6"/><path d="M50 10 L54 20 L42 20 Z" fill="#6C4AB6"/>
          <circle cx="32" cy="34" r="22" fill="#6C4AB6"/><circle cx="32" cy="38" r="15" fill="#F4EEFF"/>
          <g><circle cx="24" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="24" cy="28" r="4" fill="#33236B"/></g>
          <g><circle cx="40" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="28" r="4" fill="#33236B"/></g>
          <path class="brow brow-l" d="M17 19 Q24 15 31 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path class="brow brow-r" d="M33 19 Q40 15 47 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        </svg>
        <h1 class="title" id="title"></h1>
      </div>
      <p class="subtitle">The sum is wrong. Move just ONE stick to fix it!</p>

      <div class="block-label">Choose a level</div>
      <div class="diff-grid" role="group" aria-label="Level">
        <button class="diff easy"   data-diff="EASY"   aria-pressed="true"><div class="d-name">🌱 Easy</div><div class="d-range">add &amp; take away</div></button>
        <button class="diff medium" data-diff="MEDIUM" aria-pressed="false"><div class="d-name">⭐ Medium</div><div class="d-range">bigger numbers</div></button>
        <button class="diff hard"   data-diff="HARD"   aria-pressed="false"><div class="d-name">🔥 Hard</div><div class="d-range">times tables too</div></button>
        <button class="diff expert" data-diff="EXPERT" aria-pressed="false"><div class="d-name">🏆 Expert</div><div class="d-range">tricky &amp; big</div></button>
      </div>

      <div class="howto">
        🧩 <b>How to play:</b> Tap a wooden stick to pick it up, then tap an empty glowing spot to place it.
        Make the equation <b>true</b> by moving exactly <b>one</b> stick. The <b>×</b> and <b>=</b> signs are glued down!
      </div>

      <div class="row-btns mt"><button id="start-btn" class="btn btn-go btn-lg">Start Playing ▶</button></div>
    </section>

    <!-- ===== GAME ===== -->
    <section id="screen-game" class="hide">
      <div class="topbar">
        <button id="home-btn" class="tlink">🏠 Home</button>
        <div class="tb-center">
          <svg class="owl" id="owl-game" viewBox="0 0 64 64" aria-hidden="true" style="width:40px;height:40px;">
            <path d="M14 10 L22 20 L10 20 Z" fill="#6C4AB6"/><path d="M50 10 L54 20 L42 20 Z" fill="#6C4AB6"/>
            <circle cx="32" cy="34" r="22" fill="#6C4AB6"/><circle cx="32" cy="38" r="15" fill="#F4EEFF"/>
            <g><circle cx="24" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="24" cy="28" r="4" fill="#33236B"/></g>
            <g><circle cx="40" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="28" r="4" fill="#33236B"/></g>
            <path class="brow brow-l" d="M17 19 Q24 15 31 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path class="brow brow-r" d="M33 19 Q40 15 47 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path class="beak" d="M32 32 L28 38 L36 38 Z" fill="#FFCF43"/>
          </svg>
          <div class="level-switch">
            <button class="chip level" id="q-level" aria-haspopup="true" aria-expanded="false" aria-label="Change level">
              <span id="q-level-label">🌱 Easy</span><span class="caret">▾</span>
            </button>
            <div class="level-menu" id="level-menu" role="menu"></div>
          </div>
        </div>
        <div class="tb-right">
          <button id="skip-btn" class="tlink">⏭ Skip</button>
        </div>
      </div>
      <div class="instruct" id="instruct">Move ONE stick to make it correct.</div>

      <div class="board-wrap">
        <svg class="board" id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Matchstick equation"></svg>
      </div>

      <div class="feedback" id="feedback"></div>
      <div id="result-view" class="hide"><div class="result"><div class="rlabel" id="rlabel"></div></div></div>
      <div id="serve-view">
        <div class="actions">
          <button id="reset-btn" class="tlink">🔄 Reset</button>
          <button id="hint-btn" class="tlink">💡 Hint</button>
        </div>
      </div>
      <div class="serve-row">
        <button id="next-btn" class="btn btn-primary btn-lg hide">Next ▶</button>
      </div>
    </section>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
"use strict";
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);

/* ============================================================
   MATCHSTICK GEOMETRY  (all sticks are length ~60, in viewBox units)
   Seven-segment digits + operator/equals cells.
   ============================================================ */
const CELL_W = 100, GAP = 26, VH = 170, INSET = 7;

// digit segment endpoints (local to a 100-wide cell)
const DIGIT_SEGS = {
  a:[20,25,80,25], b:[80,25,80,85], c:[80,85,80,145],
  d:[20,145,80,145], e:[20,85,20,145], f:[20,25,20,85], g:[20,85,80,85]
};
// which segments are lit for each digit
const DIGIT_ON = {
  '0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg',
  '5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg'
};
// reverse: sorted segment string -> digit
const SEG2DIGIT = {};
for(const d in DIGIT_ON){ SEG2DIGIT[DIGIT_ON[d].split('').sort().join('')] = d; }

const OP_SEGS  = { h:[20,85,80,85], v:[50,55,50,115] };       // + = h & v ; - = h only
const OPX_SEGS = { p:[28.8,63.8,71.2,106.2], q:[28.8,106.2,71.2,63.8] }; // fixed X
const EQ_SEGS  = { t:[20,65,80,65], b:[20,105,80,105] };      // fixed =

/* ============================================================
   BOARD MODEL
   ============================================================ */
let cells = [];        // [{type,digit?,op?,x}]
let slots = [];        // [{id,ci,seg,x1,y1,x2,y2,fixed}]
let slotById = {};
let fixed = new Set(); // slot ids that never move
let filled = new Set();// slot ids currently holding a stick
let boardW = 0;

function tokensToCells(tokens){
  const c=[];
  for(const tok of tokens){
    if(/^\d$/.test(tok)) c.push({type:'digit', digit:tok});
    else if(tok==='+'||tok==='-') c.push({type:'op', op:tok});
    else if(tok==='*') c.push({type:'opx'});
    else if(tok==='=') c.push({type:'eq'});
  }
  return c;
}

// build slots + the "true" filled set for the given cells
function layout(cellsIn){
  cells = cellsIn; slots=[]; slotById={}; fixed=new Set();
  const trueFilled = new Set();
  let x=0;
  cells.forEach((cell,ci)=>{
    cell.x = x;
    const add = (seg,coords,isFixed)=>{
      const s={id:ci+'-'+seg, ci, seg, x1:coords[0]+x, y1:coords[1], x2:coords[2]+x, y2:coords[3], fixed:!!isFixed};
      slots.push(s); slotById[s.id]=s; if(isFixed) fixed.add(s.id);
    };
    if(cell.type==='digit'){
      for(const seg in DIGIT_SEGS) add(seg, DIGIT_SEGS[seg], false);
      for(const seg of DIGIT_ON[cell.digit]) trueFilled.add(ci+'-'+seg);
    } else if(cell.type==='op'){
      for(const seg in OP_SEGS) add(seg, OP_SEGS[seg], false);
      trueFilled.add(ci+'-h'); if(cell.op==='+') trueFilled.add(ci+'-v');
    } else if(cell.type==='opx'){
      for(const seg in OPX_SEGS){ add(seg, OPX_SEGS[seg], true); trueFilled.add(ci+'-'+seg); }
    } else if(cell.type==='eq'){
      for(const seg in EQ_SEGS){ add(seg, EQ_SEGS[seg], true); trueFilled.add(ci+'-'+seg); }
    }
    x += CELL_W + GAP;
  });
  boardW = x - GAP;
  return trueFilled;
}

/* ============================================================
   DECODING / EVALUATION
   ============================================================ */
function decodeCell(cell, ci, F){
  if(cell.type==='digit'){
    let s=''; for(const seg of 'abcdefg') if(F.has(ci+'-'+seg)) s+=seg;
    if(s==='') return null;
    const key = s.split('').sort().join('');
    return (key in SEG2DIGIT) ? SEG2DIGIT[key] : null;
  }
  if(cell.type==='op'){
    const h=F.has(ci+'-h'), v=F.has(ci+'-v');
    if(h&&v) return '+'; if(h&&!v) return '-'; return null;
  }
  if(cell.type==='opx') return '*';
  if(cell.type==='eq') return '=';
  return null;
}

function evalExprSafe(t){
  if(t.length===0 || t.length%2===0) return null;
  for(let i=0;i<t.length;i++){
    if(i%2===0){ if(!/^\d+$/.test(t[i])) return null; if(t[i].length>1 && t[i][0]==='0') return null; }
    else { if(!['+','-','*'].includes(t[i])) return null; }
  }
  const stack=[parseInt(t[0],10)]; const ops=[];
  for(let i=1;i<t.length;i+=2){
    const op=t[i], n=parseInt(t[i+1],10);
    if(op==='*') stack[stack.length-1]*=n; else { ops.push(op); stack.push(n); }
  }
  let r=stack[0];
  for(let k=0;k<ops.length;k++) r = ops[k]==='+' ? r+stack[k+1] : r-stack[k+1];
  return r;
}

// returns {valid, ok, display}
function decodeEquation(F){
  const tokens=[]; let cur='';
  for(let ci=0;ci<cells.length;ci++){
    const d=decodeCell(cells[ci],ci,F);
    if(d===null) return {valid:false};
    if(/[0-9]/.test(d)) cur+=d;
    else { if(cur!==''){ tokens.push(cur); cur=''; } tokens.push(d); }
  }
  if(cur!=='') tokens.push(cur);
  const eqs=tokens.filter(x=>x==='=').length;
  if(eqs!==1) return {valid:false};
  const ei=tokens.indexOf('=');
  const L=tokens.slice(0,ei), R=tokens.slice(ei+1);
  const lv=evalExprSafe(L), rv=evalExprSafe(R);
  if(lv===null||rv===null) return {valid:false};
  return {valid:true, ok: lv===rv, display: tokens.join('').replace(/\*/g,'×')};
}

/* ============================================================
   MOVES + GENERATION  (guaranteed solvable)
   ============================================================ */
// all single-stick relocations from a filled set
function singleMoves(F){
  const out=[];
  const empties = slots.filter(s=>!s.fixed && !F.has(s.id)).map(s=>s.id);
  for(const s of slots){
    if(s.fixed || !F.has(s.id)) continue;      // must be a moveable stick present
    for(const to of empties){
      if(to===s.id) continue;
      const g=new Set(F); g.delete(s.id); g.add(to);
      out.push({from:s.id, to, set:g});
    }
  }
  return out;
}

// any single move that makes the current board TRUE (for hints / safety)
function findSolution(F){
  for(const m of singleMoves(F)){
    const dec=decodeEquation(m.set);
    if(dec.valid && dec.ok) return m;
  }
  return null;
}

function num(n){ return String(n).split(''); }

function makeTrue(level){
  const build = (a,op,b)=> num(a).concat(op, num(op==='+'?a+b:op==='-'?a-b:a*b));
  const eq = (arr,res)=> arr.concat('=', num(res));
  if(level==='EASY'){
    if(Math.random()<0.5){ const a=1+rnd(9), b=1+rnd(9); return eq(num(a).concat('+',num(b)), a+b); }
    const a=2+rnd(8), b=1+rnd(a-1); return eq(num(a).concat('-',num(b)), a-b);
  }
  if(level==='MEDIUM'){
    if(Math.random()<0.5){ const a=2+rnd(30), b=2+rnd(30); if(a+b>99) return makeTrue(level); return eq(num(a).concat('+',num(b)), a+b); }
    const a=10+rnd(60), b=1+rnd(a-1); return eq(num(a).concat('-',num(b)), a-b);
  }
  if(level==='HARD'){
    const t=rnd(3);
    if(t===0){ const a=2+rnd(8), b=2+rnd(8); return eq(num(a).concat('*',num(b)), a*b); }
    if(t===1){ const a=5+rnd(40), b=5+rnd(40); if(a+b>99) return makeTrue(level); return eq(num(a).concat('+',num(b)), a+b); }
    const a=20+rnd(70), b=5+rnd(a-5); if(a>99) return makeTrue(level); return eq(num(a).concat('-',num(b)), a-b);
  }
  // EXPERT
  const t=rnd(3);
  if(t===0){ const a=3+rnd(7), b=3+rnd(7); return eq(num(a).concat('*',num(b)), a*b); }
  if(t===1){ const a=15+rnd(70), b=15+rnd(70); if(a+b>99) return makeTrue('EXPERT'); return eq(num(a).concat('+',num(b)), a+b); }
  const a=30+rnd(69), b=11+rnd(a-11); if(a>99||b>=a) return makeTrue('EXPERT'); return eq(num(a).concat('-',num(b)), a-b);
}

// produce a FALSE board one stick-move away from a TRUE one
function generatePuzzle(level){
  for(let tries=0; tries<400; tries++){
    const tokens = makeTrue(level);
    const trueFilled = layout(tokensToCells(tokens));
    // sanity: the "true" board really is true
    const base = decodeEquation(trueFilled);
    if(!base.valid || !base.ok) continue;
    // candidate reverse moves -> valid but FALSE boards
    const cands=[];
    for(const m of singleMoves(trueFilled)){
      const dec=decodeEquation(m.set);
      if(dec.valid && !dec.ok) cands.push(m);
    }
    if(!cands.length) continue;
    const pick = cands[rnd(cands.length)];
    // puzzle board = the false state; ensure it still has a solution (it does: reverse pick)
    filled = new Set(pick.set);
    return { start: new Set(pick.set) };
  }
  // extremely unlikely fallback
  const trueFilled = layout(tokensToCells(['2','+','2','=','4']));
  filled = new Set(trueFilled); filled.delete(cells.length? '0-a':'0-a');
  return { start: new Set(filled) };
}

/* ============================================================
   RENDERING
   ============================================================ */
function insetPts(x1,y1,x2,y2,i){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  return [x1+ux*i, y1+uy*i, x2-ux*i, y2-uy*i];
}
function lineEl(cls, coords, extra){
  const [x1,y1,x2,y2]=coords;
  return `<line class="${cls}" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" ${extra||''}/>`;
}
// a quiet, engraved-looking groove for "you could place a stick here" slots —
// a dark offset stroke plus a light offset stroke, so it reads as sunken rather than a bright overlay
function sunkenTargetGhost(coords){
  const [x1,y1,x2,y2]=coords;
  const horiz = y1===y2;
  const ox = horiz?0:1, oy = horiz?1:0;
  return lineEl('slotghost target-sunk-shadow', [x1+ox,y1+oy,x2+ox,y2+oy], 'stroke="#9c7a45" stroke-width="8" stroke-linecap="round"')
       + lineEl('slotghost target-sunk-hi', [x1-ox,y1-oy,x2-ox,y2-oy], 'stroke="#ffffff" stroke-width="6" stroke-linecap="round"');
}

// interaction state
let held = null;        // slot id currently "in hand" (its origin), or null
let moved = null;       // {from,to} once a stick has been relocated, or null
let solvedFlag = false;
let hintMove = null;    // {from,to} to highlight

function render(){
  const svg=$("board");
  svg.setAttribute("viewBox", `0 0 ${boardW} ${VH}`);
  const wood=[], ghost=[], hits=[];

  for(const s of slots){
    const on = filled.has(s.id);
    const isHeldOrigin = (held===s.id);
    const isHintFrom = hintMove && hintMove.from===s.id;
    const isHintTo   = hintMove && hintMove.to===s.id;

    // ---- decide visual + action ----
    if(s.fixed){
      wood.push(lineEl('stick fixed', insetPts(s.x1,s.y1,s.x2,s.y2,INSET), 'stroke="url(#woodFixed)" stroke-width="12" stroke-linecap="round"'));
      hits.push(lineEl('hit locked', insetPts(s.x1,s.y1,s.x2,s.y2,2), `stroke="transparent" stroke-width="30" data-act="fixed"`));
      continue;
    }
    if(isHeldOrigin){
      // the empty hole where the in-hand stick came from (tap to cancel)
      ghost.push(lineEl('slotghost origin', insetPts(s.x1,s.y1,s.x2,s.y2,INSET), 'stroke="var(--grape)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.55"'));
      hits.push(lineEl('hit', insetPts(s.x1,s.y1,s.x2,s.y2,2), `stroke="transparent" stroke-width="30" data-act="cancel" data-id="${s.id}"`));
      continue;
    }
    if(on){
      let cls='stick', act='lift', locked=false;
      if(moved && held===null && s.id!==moved.to){ act='blocked'; locked=true; } // only the moved stick may be re-lifted
      if(isHintFrom) cls+=' hint-from';
      wood.push(lineEl(cls, insetPts(s.x1,s.y1,s.x2,s.y2,INSET), 'stroke="url(#wood)" stroke-width="12" stroke-linecap="round"'));
      hits.push(lineEl('hit'+(locked?' locked':''), insetPts(s.x1,s.y1,s.x2,s.y2,2), `stroke="transparent" stroke-width="30" data-act="${act}" data-id="${s.id}"`));
      continue;
    }
    // empty non-fixed slot
    if(held!==null){
      if(isHintTo){
        ghost.push(lineEl('slotghost target hint-to', insetPts(s.x1,s.y1,s.x2,s.y2,INSET), 'stroke="var(--sun-dark)" stroke-width="11" stroke-linecap="round"'));
      } else {
        ghost.push(sunkenTargetGhost(insetPts(s.x1,s.y1,s.x2,s.y2,INSET)));
      }
      hits.push(lineEl('hit', insetPts(s.x1,s.y1,s.x2,s.y2,2), `stroke="transparent" stroke-width="30" data-act="place" data-id="${s.id}"`));
    } else if(isHintTo){
      ghost.push(lineEl('slotghost hint-to', insetPts(s.x1,s.y1,s.x2,s.y2,INSET), 'stroke="var(--sun-dark)" stroke-width="11" stroke-linecap="round"'));
    }
  }

  svg.innerHTML = `
    <defs>
      <linearGradient id="wood" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${VH}">
        <stop offset="0" stop-color="#F0C07E"/><stop offset="0.5" stop-color="#DB9A44"/><stop offset="1" stop-color="#B5761F"/>
      </linearGradient>
      <linearGradient id="woodFixed" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${VH}">
        <stop offset="0" stop-color="#C9B79B"/><stop offset="1" stop-color="#9C8968"/>
      </linearGradient>
      <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#7a4a10" flood-opacity="0.28"/>
      </filter>
    </defs>
    <g>${ghost.join('')}</g>
    <g filter="url(#ds)">${wood.join('')}</g>
    <g>${hits.join('')}</g>
  `;
}

/* ============================================================
   INTERACTION
   ============================================================ */
function onBoardClick(e){
  const t = e.target.closest('.hit'); if(!t) return;
  if(solvedFlag) return;
  const act = t.getAttribute('data-act');
  const id  = t.getAttribute('data-id');
  hintMove = null; // any interaction clears hint highlight

  if(act==='fixed'){ flash("That sign is glued down — it can't move!", 'hint'); setOwl('think'); return; }

  if(held===null){
    if(act==='lift'){
      // begin a move (fresh) OR re-lift the already-moved stick
      const origin = (moved && id===moved.to) ? moved.from : id;
      filled.delete(id);
      held = origin;
      moved = null;
      sound('tick');
      render();
    } else if(act==='blocked'){
      flash("Only one stick can move. Tap 🔄 Reset to try another.", 'hint');
      setOwl('think');
    }
    return;
  }

  // a stick is in hand
  if(act==='cancel'){                 // tapped the origin hole -> put it back
    filled.add(held); held=null; sound('tick'); render(); return;
  }
  if(act==='place'){
    filled.add(id);
    moved = { from: held, to: id };
    held = null;
    sound('tick');
    render();
    completeMove();
  }
}

function completeMove(){
  const dec = decodeEquation(filled);
  if(dec.valid && dec.ok){ onSolved(dec); return; }
  if(!dec.valid){
    flash("Hmm, that doesn't make a real number. Try a different spot!", 'bad');
  } else {
    flash("Not right yet — pick the stick up again, or tap 🔄 Reset.", 'bad');
  }
  setOwl('worried'); sound('bad');
}

function onSolved(dec){
  solvedFlag=true;
  flash('', '');
  $("serve-view").classList.add("hide"); $("result-view").classList.remove("hide");
  $("rlabel").textContent = "🎉 Correct! " + dec.display + "  " + praise();
  $("skip-btn").classList.add("invisible");   // Next takes its place in the bottom slot; Skip keeps its slot so nothing shifts
  $("next-btn").classList.remove("hide"); $("next-btn").focus();
  setOwl('win'); sound('win');
  if(!reduceMotion) miniConfetti();
  render();
}

function praise(){
  const p=["🎉","🌟","Nice thinking! ✨","Brilliant! 👏","You fixed it! 🙌","Sharp eyes! 👀"];
  return p[rnd(p.length)];
}
function flash(msg,kind){ const f=$("feedback"); f.textContent=msg; f.className="feedback "+(kind||''); }

/* ============================================================
   SESSION
   ============================================================ */
let level="EASY", game=null, muted=false, prevSig=null;
const LEVEL_LABEL = { EASY:"🌱 Easy", MEDIUM:"⭐ Medium", HARD:"🔥 Hard", EXPERT:"🏆 Expert" };

function setLevel(l){
  level=l;
  document.querySelectorAll(".diff").forEach(b=>b.setAttribute("aria-pressed", b.dataset.diff===l));
  const lbl=$("q-level-label"); if(lbl) lbl.textContent=LEVEL_LABEL[l];
  document.querySelectorAll(".level-opt").forEach(b=>b.setAttribute("aria-current", b.dataset.diff===l));
}
document.querySelectorAll(".diff").forEach(b=> b.onclick=()=>setLevel(b.dataset.diff));

// level switcher (tap the chip at the top to change difficulty mid-game)
(function buildLevelMenu(){
  const menu=$("level-menu");
  menu.innerHTML=Object.entries(LEVEL_LABEL).map(([k,v])=>
    `<button class="level-opt" role="menuitemradio" data-diff="${k}" aria-current="false"><span>${v}</span><span class="tick">✓</span></button>`).join('');
  menu.querySelectorAll(".level-opt").forEach(b=> b.onclick=()=>pickLevel(b.dataset.diff));
})();
function toggleLevelMenu(){ const m=$("level-menu"); const open=m.classList.toggle("open"); $("q-level").setAttribute("aria-expanded", open); }
function closeLevelMenu(){ $("level-menu").classList.remove("open"); $("q-level").setAttribute("aria-expanded","false"); }
function pickLevel(l){ closeLevelMenu(); if(l===level) return; setLevel(l); newPuzzle(); }
$("q-level").onclick=(e)=>{ e.stopPropagation(); toggleLevelMenu(); };
document.addEventListener("click", e=>{ if(!e.target.closest(".level-switch")) closeLevelMenu(); });

$("start-btn").onclick = startSession;
$("home-btn").onclick  = goHome;
$("next-btn").onclick   = newPuzzle;
$("reset-btn").onclick  = ()=>{ if(solvedFlag) return; filled=new Set(game.start); held=null; moved=null; hintMove=null;
  flash("Board reset. Move one stick to fix it.", ''); setOwl('idle'); render(); };
$("skip-btn").onclick   = ()=>{ if(solvedFlag) return; newPuzzle(); };
$("hint-btn").onclick   = giveHint;
$("board").addEventListener('click', onBoardClick);

function startSession(){
  game = { usedHint:false, start:null };
  setLevel(level);
  $("screen-home").classList.add("hide");
  $("screen-game").classList.remove("hide");
  setOwl('idle');
  newPuzzle();
}

const puzzleSig = start => Array.from(start).sort().join(',');
function newPuzzle(){
  solvedFlag=false; held=null; moved=null; hintMove=null; game.usedHint=false;
  // fresh puzzle, different from the one just shown (Skip/Next never repeat the current puzzle)
  let r; for(let a=0;a<15;a++){ r=generatePuzzle(level); if(!prevSig || puzzleSig(r.start)!==prevSig) break; }
  game.start = new Set(r.start);
  prevSig = puzzleSig(game.start);
  $("serve-view").classList.remove("hide"); $("result-view").classList.add("hide");
  $("next-btn").classList.add("hide"); $("skip-btn").classList.remove("invisible");
  flash("This sum is wrong. Move ONE stick to fix it!", '');
  $("instruct").textContent = "Tap a stick, then tap a glowing spot.";
  setOwl('idle');
  render();
}

function giveHint(){
  if(solvedFlag) return;
  // reset any in-progress move so the hint refers to the puzzle's own start
  filled=new Set(game.start); held=null; moved=null;
  const sol = findSolution(filled);
  if(!sol){ flash("This one's a real puzzler — try any single move!", 'hint'); render(); return; }
  hintMove = { from: sol.from, to: sol.to };
  game.usedHint=true;
  flash("💡 Take the glowing stick and move it to the glowing spot.", 'hint');
  setOwl('think');
  render();
}

function goHome(){
  stopConfetti();
  $("screen-game").classList.add("hide");
  $("screen-home").classList.remove("hide");
  setOwl('idle');
}

// keyboard: R reset, H hint, Enter/Space -> next (when solved), Escape closes the level menu
document.addEventListener("keydown", e=>{
  if(e.key==='Escape'){ closeLevelMenu(); }
  if($("screen-game").classList.contains("hide")) return;
  if(!game) return;
  if((e.key==="Enter"||e.key===" ") && solvedFlag){ e.preventDefault(); newPuzzle(); }
  else if(e.key.toLowerCase()==="r" && !solvedFlag){ $("reset-btn").click(); }
  else if(e.key.toLowerCase()==="h" && !solvedFlag){ $("hint-btn").click(); }
});

/* ============================================================
   OWL / SOUND / CONFETTI / TITLE  (shared with sibling games)
   ============================================================ */
function setOwl(mood){
  const owl=$("owl-game"); const owl2=$("owl-home");
  [owl,owl2].forEach(o=>{ if(!o) return; o.classList.remove("happy","worried","win","think"); if(mood!=="idle") o.classList.add(mood); });
}

let audioCtx=null;
function beep(freq,dur,type="sine",when=0,gain=0.15){
  if(muted) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime+when, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(gain,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
function sound(kind){
  if(kind==="tick"){ beep(520,.05,"square",0,.06); }
  else if(kind==="good"){ beep(660,.12,"triangle"); beep(880,.14,"triangle",.08); }
  else if(kind==="bad"){ beep(200,.22,"sawtooth",0,.12); }
  else if(kind==="win"){ [523,659,784,1047].forEach((f,i)=>beep(f,.18,"triangle",i*.10)); }
}

let confettiRAF=null;
function launchConfetti(){
  const cv=$("confetti"); cv.style.display="block"; const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const colors=["#6C4AB6","#FF6B7A","#2FB37D","#FFCF43","#3FA7E0","#DB9A44"];
  const parts=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
    r:5+Math.random()*7,c:colors[Math.floor(Math.random()*colors.length)],vy:2+Math.random()*3,
    vx:-1.5+Math.random()*3,rot:Math.random()*6,vr:-.2+Math.random()*.4}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    f++; if(f<220) confettiRAF=requestAnimationFrame(draw); else stopConfetti();})();
}
function miniConfetti(){
  const cv=$("confetti"); cv.style.display="block"; const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const colors=["#2FB37D","#FFCF43","#3FA7E0","#FF6B7A","#DB9A44"];
  const parts=Array.from({length:46},()=>({x:cv.width/2,y:cv.height*0.35,r:5+Math.random()*6,
    c:colors[Math.floor(Math.random()*colors.length)],vy:-4+Math.random()*2,vx:-4+Math.random()*8,rot:0,vr:.2}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    f++; if(f<60) requestAnimationFrame(draw); else stopConfetti();})();
}
function stopConfetti(){ if(confettiRAF) cancelAnimationFrame(confettiRAF);
  const cv=$("confetti"); if(cv){ cv.getContext("2d").clearRect(0,0,cv.width,cv.height); cv.style.display="none"; } }

(function(){
  const word="Matchstick Math"; const cls=["c1","c2","c3","c4"]; const el=$("title"); let ci=0;
  for(const ch of word){
    if(ch===" "){ el.appendChild(document.createTextNode("\u00A0")); continue; }
    const s=document.createElement("span"); s.textContent=ch; s.className=cls[ci++%cls.length];
    if(!reduceMotion) s.style.animation=`bob 2.4s ease-in-out ${(ci*0.06).toFixed(2)}s infinite`;
    el.appendChild(s);
  }
  if(!reduceMotion){ const st=document.createElement("style");
    st.textContent="@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}";
    document.head.appendChild(st); }
})();

setLevel("EASY");
</script>
