<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What Comes Next</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --sky-top:#A8E0FF; --sky-bot:#D9F6E4; --ink:#33236B; --ink-soft:#6a5aa0;
    --grape:#6C4AB6; --grape-dark:#553a95; --sun:#FFCF43; --sun-dark:#e6a800; --coral:#FF6B7A; --coral-dark:#e24a5c;
    --leaf:#2FB37D; --leaf-dark:#218a60; --sky:#3FA7E0; --sky-dark:#2b86ba; --card:#FFFFFF; --key-line:#E4DCF5;
    --paper:#FBF3E4; --paper-line:#EAD9BC; --shadow:0 18px 40px rgba(72,45,130,.18); --radius:26px; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Nunito',system-ui,sans-serif; color:var(--ink); min-height:100vh; min-height:100dvh;
    background:linear-gradient(180deg,var(--sky-top) 0%,#C6ECEC 45%,var(--sky-bot) 100%); background-attachment:fixed;
    display:flex; align-items:flex-start; justify-content:center; padding:22px 14px 60px;}
  body::before,body::after{content:""; position:fixed; z-index:0; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(1px);
    box-shadow:60px 10px 0 -6px rgba(255,255,255,.55), 120px 4px 0 -10px rgba(255,255,255,.5);}
  body::before{width:90px;height:34px;top:8%;left:6%;} body::after{width:70px;height:26px;top:16%;right:10%;}
  .app{position:relative; z-index:1; width:100%; max-width:600px;}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px;}
  .brand{display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:4px;}
  .title{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(24px,4.9vw,38px); line-height:1; margin:0; text-align:center;}
  .title .c1{color:var(--grape);} .title .c2{color:var(--coral);} .title .c3{color:var(--leaf);} .title .c4{color:var(--sun-dark);}
  .subtitle{text-align:center; color:var(--ink-soft); font-weight:700; margin:2px 0 18px; font-size:15px;}
  .owl{width:60px; height:60px; flex:0 0 auto;} .owl .pupil{transition:transform .2s ease;}
  .owl.think .pupil{transform:translateY(2px);} .owl.worried .brow-l{transform:rotate(14deg) translateY(-1px);} .owl.worried .brow-r{transform:rotate(-14deg) translateY(-1px);} .owl.win .beak{transform:translateY(1px) scale(1.05);}
  .btn{font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px; border:none; cursor:pointer; color:#fff; border-radius:16px;
    padding:13px 22px; transition:transform .06s ease, filter .15s ease; box-shadow:0 5px 0 var(--btn-shadow,#0003); user-select:none;}
  .btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 var(--btn-shadow,#0003);} .btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px;}
  .btn-primary{background:var(--grape); --btn-shadow:var(--grape-dark);} .btn-go{background:var(--leaf); --btn-shadow:var(--leaf-dark);}
  .btn-warn{background:var(--coral); --btn-shadow:var(--coral-dark);} .btn-ghost{background:#F1EDFA; color:var(--grape); --btn-shadow:#d9d0ef;}
  .btn:disabled{filter:grayscale(.4) opacity(.5); cursor:not-allowed;} .btn-lg{font-size:20px; padding:16px 34px;}
  .block-label{font-family:'Fredoka',sans-serif; font-weight:600; color:var(--grape); font-size:15px; text-transform:uppercase; letter-spacing:1px; margin:20px 0 10px;}
  .diff-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;} @media(min-width:560px){.diff-grid{grid-template-columns:repeat(4,1fr);}}
  .diff{border:3px solid #EEE8FB; background:#fff; border-radius:18px; cursor:pointer; padding:14px 10px; text-align:center; transition:all .15s ease;}
  .diff:focus-visible{outline:3px solid var(--grape); outline-offset:2px;}
  .diff .d-name{font-family:'Fredoka',sans-serif; font-weight:600; font-size:19px;} .diff .d-range{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-top:3px;}
  .diff[aria-pressed="true"]{border-color:var(--dc,var(--grape)); background:var(--dbg,#F4F0FE); transform:translateY(-2px); box-shadow:var(--shadow);}
  .diff.easy{--dc:var(--leaf); --dbg:#E8F8F0;} .diff.medium{--dc:var(--sky); --dbg:#E6F4FC;} .diff.hard{--dc:var(--sun-dark); --dbg:#FFF6DC;} .diff.expert{--dc:var(--coral); --dbg:#FFEAED;}
  .howto{background:#F4F0FE; border-radius:16px; padding:14px 16px; margin-top:18px; font-weight:700; color:var(--ink-soft); font-size:14px; line-height:1.5;} .howto b{color:var(--grape);}
  .mt{margin-top:22px;} .row-btns{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}

  .home-top{display:flex; margin-bottom:4px;}
  .hub-link{font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--grape); text-decoration:none; opacity:.8;}
  .hub-link:hover{opacity:1; text-decoration:underline;}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:22px;}
  .topbar .tb-center{display:flex; align-items:center; gap:8px; min-width:0;}
  .topbar .tb-right{display:flex; align-items:center; gap:8px;}
  .chip{font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:#fff; background:var(--grape); padding:6px 14px; border-radius:999px;}

  /* text-link controls (Home / Skip / Next / Hint) — look like links, not buttons */
  .tlink{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; color:var(--grape); background:none; border:none;
    cursor:pointer; text-decoration:none; padding:6px 6px; display:inline-flex; align-items:center; gap:5px; opacity:.82;}
  .tlink:hover{opacity:1;} .tlink.off{opacity:.32; pointer-events:none;}
  .tlink:focus-visible{outline:3px solid var(--grape); outline-offset:2px; border-radius:10px;}
  .actions{display:flex; gap:22px; justify-content:center; align-items:center; margin:12px 0 18px;}
  .serve-row{display:flex; justify-content:center; margin-top:6px;}
  .invisible{visibility:hidden !important;}  /* hidden but keeps its space, so the top bar doesn't reflow */

  .level-switch{position:relative; display:inline-block;}
  .chip.level{cursor:pointer; user-select:none; border:none; display:inline-flex; align-items:center; gap:5px;}
  .chip.level:hover{filter:brightness(1.07);} .chip.level .caret{font-size:10px; opacity:.85;}
  .chip.level:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .level-menu{position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:40;
    background:#fff; border:2px solid var(--key-line); border-radius:14px; box-shadow:var(--shadow); padding:6px; min-width:160px; display:none;}
  .level-menu.open{display:block;}
  .level-opt{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; color:var(--ink); background:none; border:none; cursor:pointer; padding:9px 12px; border-radius:10px; white-space:nowrap;}
  .level-opt:hover{background:#F4F0FE;} .level-opt[aria-current="true"]{background:#F1EDFA; color:var(--grape);}
  .level-opt .tick{color:var(--leaf-dark); font-weight:700; opacity:0;} .level-opt[aria-current="true"] .tick{opacity:1;}

  .prompt{text-align:center; font-family:'Fredoka',sans-serif; font-weight:600; color:var(--grape-dark); font-size:clamp(16px,4vw,20px); margin-bottom:14px;}
  .seq{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; margin-bottom:8px;}
  .cell{min-width:clamp(46px,13vw,62px); height:clamp(52px,15vw,66px); border-radius:14px; background:#fff; border:3px solid var(--key-line);
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(22px,6vw,30px); padding:0 6px;}
  .cell.blank{border-style:dashed; border-color:var(--grape); background:#F4F0FE; color:var(--grape); animation:pulse 1.2s ease-in-out infinite;}
  .cell.filled{border-color:var(--leaf); background:#EAF9F1; animation:pop .3s ease;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .arrow{color:var(--ink-soft); font-weight:800; font-size:20px;}

  .optlabel{text-align:center; font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink-soft); font-size:13px; text-transform:uppercase; letter-spacing:1px; margin:16px 0 8px;}
  .options{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .opt{min-width:clamp(60px,17vw,78px); height:clamp(60px,17vw,74px); border-radius:16px; border:3px solid var(--key-line); background:#fff; cursor:pointer;
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(24px,6.5vw,32px); box-shadow:0 5px 0 #e7dff7; transition:transform .06s; display:flex; align-items:center; justify-content:center; padding:0 6px;}
  .opt:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 #e7dff7;} .opt:focus-visible{outline:3px solid var(--grape); outline-offset:2px;}
  .opt:hover:not(:disabled){border-color:var(--grape);}
  .opt.wrong{animation:shake .35s ease; border-color:var(--coral);} @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .opt.correct{border-color:var(--leaf); background:#EAF9F1;} .opt:disabled{cursor:default;}

  .result{text-align:center; padding:8px 4px 16px;} .result .rlabel{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(20px,5vw,26px); color:var(--leaf-dark);}
  .feedback{min-height:22px; text-align:center; font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; margin:14px 0 12px; display:flex; align-items:center; justify-content:center;}
  .feedback.good{color:var(--leaf-dark);} .feedback.bad{color:var(--coral-dark);} .feedback.hint{color:var(--sun-dark);}
  canvas#confetti{position:fixed; inset:0; z-index:60; pointer-events:none; display:none;}
  .hide{display:none !important;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div class="app">
  <div class="card">

    <section id="screen-home">
      <div class="home-top"><a class="hub-link" href="../">← All games</a></div>
      <div class="brand">
        <svg class="owl" id="owl-home" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M14 10 L22 20 L10 20 Z" fill="#6C4AB6"/><path d="M50 10 L54 20 L42 20 Z" fill="#6C4AB6"/>
          <circle cx="32" cy="34" r="22" fill="#6C4AB6"/><circle cx="32" cy="38" r="15" fill="#F4EEFF"/>
          <g><circle cx="24" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="24" cy="28" r="4" fill="#33236B"/></g>
          <g><circle cx="40" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="28" r="4" fill="#33236B"/></g>
          <path class="brow brow-l" d="M17 19 Q24 15 31 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path class="brow brow-r" d="M33 19 Q40 15 47 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path class="beak" d="M32 32 L28 38 L36 38 Z" fill="#FFCF43"/>
        </svg>
        <h1 class="title" id="title"></h1>
      </div>
      <p class="subtitle">🔢 Spot the pattern and pick what comes next!</p>
      <div class="block-label">Choose a level</div>
      <div class="diff-grid" role="group" aria-label="Level">
        <button class="diff easy"   data-diff="EASY"   aria-pressed="true"><div class="d-name">🌱 Easy</div><div class="d-range">colour patterns</div></button>
        <button class="diff medium" data-diff="MEDIUM" aria-pressed="false"><div class="d-name">⭐ Medium</div><div class="d-range">+ counting</div></button>
        <button class="diff hard"   data-diff="HARD"   aria-pressed="false"><div class="d-name">🔥 Hard</div><div class="d-range">skip & double</div></button>
        <button class="diff expert" data-diff="EXPERT" aria-pressed="false"><div class="d-name">🏆 Expert</div><div class="d-range">tricky rules</div></button>
      </div>
      <div class="howto">
        🧩 <b>How to play:</b> Look at the row and figure out the rule — the colours might repeat, or the numbers might grow. Then tap the
        tile that <b>comes next</b> in the blank!
      </div>
      <div class="row-btns mt"><button id="start-btn" class="btn btn-go btn-lg">Start ▶</button></div>
    </section>

    <section id="screen-game" class="hide">
      <div class="topbar">
        <button id="home-btn" class="tlink">🏠 Home</button>
        <div class="tb-center">
          <svg class="owl" id="owl-game" viewBox="0 0 64 64" aria-hidden="true" style="width:40px;height:40px;">
            <path d="M14 10 L22 20 L10 20 Z" fill="#6C4AB6"/><path d="M50 10 L54 20 L42 20 Z" fill="#6C4AB6"/>
            <circle cx="32" cy="34" r="22" fill="#6C4AB6"/><circle cx="32" cy="38" r="15" fill="#F4EEFF"/>
            <g><circle cx="24" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="24" cy="28" r="4" fill="#33236B"/></g>
            <g><circle cx="40" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="28" r="4" fill="#33236B"/></g>
            <path class="brow brow-l" d="M17 19 Q24 15 31 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path class="brow brow-r" d="M33 19 Q40 15 47 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path class="beak" d="M32 32 L28 38 L36 38 Z" fill="#FFCF43"/>
          </svg>
          <div class="level-switch">
            <button class="chip level" id="q-level" aria-haspopup="true" aria-expanded="false" aria-label="Change level">
              <span id="q-level-label">🌱 Easy</span><span class="caret">▾</span>
            </button>
            <div class="level-menu" id="level-menu" role="menu"></div>
          </div>
        </div>
        <div class="tb-right">
          <button id="new-btn" class="tlink">⏭ Skip</button>
        </div>
      </div>

      <div class="prompt">What comes next? 🤔</div>
      <div class="seq" id="seq"></div>

      <div id="play-view">
        <div class="optlabel">Tap your answer</div>
        <div class="options" id="options"></div>
      </div>
      <div id="result-view" class="hide"><div class="result"><div class="rlabel" id="rlabel"></div></div></div>

      <div class="feedback" id="feedback"></div>
      <div id="serve-view">
        <div class="actions">
          <button id="hint-link" class="tlink">💡 Hint</button>
        </div>
      </div>
      <div class="serve-row">
        <button id="next-btn" class="btn btn-primary btn-lg hide">Next ▶</button>
      </div>
    </section>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
"use strict";
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const SYMBOLS=['🔴','🔵','🟡','🟢','🟣','🟠','⭐','❤️','🔺','⬛'];

/* ===== engine (verified offline) ===== */
const LEVELS={
  EASY:  { kinds:['repeat'],         templates:['AB','ABC','AAB'],           arith:null, label:"🌱 Easy" },
  MEDIUM:{ kinds:['repeat','arith'], templates:['AAB','ABB','ABBC','AABB'],  arith:{steps:[1,2,5,10],dir:[1],geo:null}, label:"⭐ Medium" },
  HARD:  { kinds:['arith','geo'],    templates:['ABBC','AABB'],              arith:{steps:[2,3,4,5,10],dir:[1,-1],geo:[2]}, label:"🔥 Hard" },
  EXPERT:{ kinds:['arith','geo'],    templates:['ABBC'],                     arith:{steps:[3,4,6,7,9,12],dir:[1,-1],geo:[2,3]}, label:"🏆 Expert" },
};
function distinctDistractors(answer,cands,k){ const out=[]; for(const c of shuffle(cands.slice())){ if(c!==answer&&c>0&&!out.includes(c)){ out.push(c); if(out.length>=k)break; } }
  let d=1; while(out.length<k){ for(const s of [answer+d,answer-d]){ if(s!==answer&&s>0&&!out.includes(s)){ out.push(s); if(out.length>=k)break; } } d++; if(d>50)break; } return out.slice(0,k); }
function genRepeat(level){ const cfg=LEVELS[level]; const tmpl=pick(cfg.templates); const letters=[...new Set(tmpl.split(''))];
  const syms=shuffle(SYMBOLS.slice()).slice(0,letters.length); const map={}; letters.forEach((L,i)=>map[L]=syms[i]);
  const unit=tmpl.split('').map(L=>map[L]); const U=unit.length; const total=2*U+1+rnd(U);
  const items=[]; for(let i=0;i<total;i++) items.push(unit[i%U]); const blankIndex=total-1, answer=items[blankIndex];
  const opts=[...new Set(syms)]; if(!opts.includes(answer)) opts.push(answer); for(const s of SYMBOLS){ if(opts.length>=4)break; if(!opts.includes(s)) opts.push(s); }
  return { level, kind:'repeat', items, blankIndex, answer, options:shuffle(opts.slice(0,4)), isNumber:false, rule:`the pattern repeats ${unit.join('')}` }; }
function genArith(level){ const cfg=LEVELS[level].arith; const d=pick(cfg.steps)*pick(cfg.dir); const n=3+rnd(2);
  let start; if(d>0) start=1+rnd(10); else start=Math.abs(d)*(n+2)+rnd(10);
  const items=[]; for(let i=0;i<=n;i++) items.push(start+i*d); if(items.some(x=>x<=0)) return null;
  const answer=items[n], last=items[n-1], prev=items[n-2]; const cands=[answer+d,answer-d,last,answer+1,answer-1,last+(last-prev)+d];
  return { level, kind:'arith', items, blankIndex:n, answer, options:shuffle([answer,...distinctDistractors(answer,cands,3)]), isNumber:true, rule:`${d>0?'add':'subtract'} ${Math.abs(d)} each time` }; }
function genGeo(level){ const cfg=LEVELS[level].arith; const r=pick(cfg.geo); const n=3+rnd(1); const start=2+rnd(4);
  const items=[]; for(let i=0;i<=n;i++) items.push(start*Math.pow(r,i)); if(items[items.length-1]>2000) return null;
  const answer=items[n], last=items[n-1], prev=items[n-2]; const cands=[last*(r+1),last+(last-prev),answer+last,answer-last,answer+r,answer-r];
  return { level, kind:'geo', items, blankIndex:n, answer, options:shuffle([answer,...distinctDistractors(answer,cands,3)]), isNumber:true, rule:`multiply by ${r} each time` }; }
function genPuzzle(level){ const cfg=LEVELS[level]; for(let a=0;a<100;a++){ const k=pick(cfg.kinds); let p=null;
  if(k==='repeat') p=genRepeat(level); else if(k==='arith') p=genArith(level); else if(k==='geo') p=genGeo(level); if(p) return p; } return genRepeat(level); }

/* ===== state ===== */
let level="EASY", muted=false, P=null, phase='play', prevSig=null;
function setLevel(l){
  level=l;
  document.querySelectorAll(".diff").forEach(b=>b.setAttribute("aria-pressed", b.dataset.diff===l));
  const lbl=$("q-level-label"); if(lbl) lbl.textContent=LEVELS[l].label;
  document.querySelectorAll(".level-opt").forEach(b=>b.setAttribute("aria-current", b.dataset.diff===l));
}
document.querySelectorAll(".diff").forEach(b=> b.onclick=()=>setLevel(b.dataset.diff));

// level switcher (tap the chip at the top to change difficulty mid-game)
(function buildLevelMenu(){
  const menu=$("level-menu");
  menu.innerHTML=Object.entries(LEVELS).map(([k,v])=>
    `<button class="level-opt" role="menuitemradio" data-diff="${k}" aria-current="false"><span>${v.label}</span><span class="tick">✓</span></button>`).join('');
  menu.querySelectorAll(".level-opt").forEach(b=> b.onclick=()=>pickLevel(b.dataset.diff));
})();
function toggleLevelMenu(){ const m=$("level-menu"); const open=m.classList.toggle("open"); $("q-level").setAttribute("aria-expanded", open); }
function closeLevelMenu(){ $("level-menu").classList.remove("open"); $("q-level").setAttribute("aria-expanded","false"); }
function pickLevel(l){ closeLevelMenu(); if(l===level) return; setLevel(l); newRound(false); }
$("q-level").onclick=(e)=>{ e.stopPropagation(); toggleLevelMenu(); };
document.addEventListener("click", e=>{ if(!e.target.closest(".level-switch")) closeLevelMenu(); });

$("start-btn").onclick=()=>{ newRound(true); }; $("home-btn").onclick=goHome;
$("new-btn").onclick=()=>{ newRound(false); }; $("next-btn").onclick=()=>newRound(false);
$("hint-link").onclick=giveHint;

const puzzleSig = p => p.kind+':'+p.items.join(',');
function newRound(fromHome){
  let p; for(let a=0;a<15;a++){ p=genPuzzle(level); if(!prevSig || puzzleSig(p)!==prevSig) break; }
  P=p; prevSig=puzzleSig(P);
  phase='play';
  if(fromHome){ $("screen-home").classList.add("hide"); $("screen-game").classList.remove("hide"); }
  setLevel(level);
  $("play-view").classList.remove("hide"); $("result-view").classList.add("hide");
  $("serve-view").classList.remove("hide"); $("next-btn").classList.add("hide");
  $("new-btn").classList.remove("invisible"); $("hint-link").classList.remove("off");
  renderSeq(); renderOptions(); setOwl('idle'); flash("Look at the pattern — what comes next?", '');
}
function renderSeq(){
  const el=$("seq"); el.dataset.answer=String(P.answer); el.innerHTML="";
  P.items.forEach((v,i)=>{
    if(i>0){ const ar=document.createElement('span'); ar.className='arrow'; ar.textContent='→'; el.appendChild(ar); }
    const c=document.createElement('div'); c.className='cell'+(i===P.blankIndex?' blank':''); c.dataset.i=i;
    c.textContent = i===P.blankIndex ? '?' : v; el.appendChild(c);
  });
}
function renderOptions(){
  const el=$("options"); el.innerHTML="";
  P.options.forEach(v=>{ const b=document.createElement('button'); b.className='opt'; b.dataset.value=String(v); b.textContent=v; b.onclick=()=>choose(v,b); el.appendChild(b); });
}
function choose(v, btn){
  if(phase!=='play') return;
  if(v===P.answer){
    phase='done';
    btn.classList.add('correct'); btn.disabled=true;
    const blank=$("seq").querySelector('.cell.blank'); if(blank){ blank.classList.remove('blank'); blank.classList.add('filled'); blank.textContent=P.answer; }
    $("options").querySelectorAll('.opt').forEach(b=>b.disabled=true);
    $("play-view").classList.add("hide"); $("result-view").classList.remove("hide");
    $("serve-view").classList.add("hide");
    $("rlabel").textContent=`🎉 Yes — ${P.answer} comes next!`;
    $("new-btn").classList.add("invisible");   // Next takes its place in the bottom slot; Skip keeps its slot so nothing shifts
    $("next-btn").classList.remove("hide"); $("next-btn").focus(); flash('', ''); setOwl('win');
    if(!reduceMotion) miniConfetti(); sound('win');
  } else {
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    flash(`Not that one — look at the pattern again!`, 'bad'); setOwl('worried'); sound('bad');
  }
}
function giveHint(){ if(phase!=='play') return; flash(`💡 Rule: ${P.rule}. What fits the blank?`, 'hint'); setOwl('think'); }
function flash(msg,kind){ const f=$("feedback"); f.textContent=msg; f.className="feedback "+(kind||''); }
function goHome(){ stopConfetti(); P=null; $("screen-game").classList.add("hide"); $("screen-home").classList.remove("hide"); setOwl('idle'); }

document.addEventListener("keydown", e=>{
  if(e.key==='Escape'){ closeLevelMenu(); }
  if($("screen-game").classList.contains("hide") || !P) return;
  if(e.target && e.target.id==='hint-link') return;
  if(e.key==='Enter' && phase==='done'){ e.preventDefault(); newRound(false); }
  if(e.key.toLowerCase()==='h' && phase==='play') giveHint();
});

/* ===== owl / sound / confetti / title (shared) ===== */
function setOwl(mood){ [ $("owl-game"), $("owl-home") ].forEach(o=>{ if(!o) return; o.classList.remove("worried","win","think"); if(mood!=="idle") o.classList.add(mood); }); }
let audioCtx=null;
function beep(freq,dur,type="sine",when=0,gain=0.12){ if(muted) return;
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime+when, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur); }catch(e){} }
function sound(kind){ if(kind==="bad") beep(190,.16,"sawtooth",0,.10); else if(kind==="win") [523,659,784,1047].forEach((f,i)=>beep(f,.16,"triangle",i*.08)); }
let confettiRAF=null;
function miniConfetti(){ const cv=$("confetti"); cv.style.display="block"; const ctx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const colors=["#6C4AB6","#2FB37D","#FFCF43","#3FA7E0","#FF6B7A"];
  const parts=Array.from({length:75},()=>({x:cv.width/2,y:cv.height*0.35,r:5+Math.random()*7,c:colors[Math.floor(Math.random()*colors.length)],vy:-5+Math.random()*2,vx:-6+Math.random()*12,rot:0,vr:.25}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height); parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    f++; if(f<75) confettiRAF=requestAnimationFrame(draw); else stopConfetti();})(); }
function stopConfetti(){ if(confettiRAF) cancelAnimationFrame(confettiRAF); const cv=$("confetti"); if(cv){ cv.getContext("2d").clearRect(0,0,cv.width,cv.height); cv.style.display="none"; } }

(function(){ const word="What Comes Next"; const cls=["c1","c2","c3","c4"]; const el=$("title"); let ci=0;
  for(const ch of word){ if(ch===" "){ el.appendChild(document.createTextNode("\u00A0")); continue; }
    const s=document.createElement("span"); s.textContent=ch; s.className=cls[ci++%cls.length];
    if(!reduceMotion) s.style.animation=`bobw 2.4s ease-in-out ${(ci*0.05).toFixed(2)}s infinite`; el.appendChild(s); }
  if(!reduceMotion){ const st=document.createElement("style"); st.textContent="@keyframes bobw{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}"; document.head.appendChild(st); }
})();
setLevel("EASY");
</script>
