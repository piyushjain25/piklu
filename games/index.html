<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Piklu — Learning Games for Kids</title>
<meta name="description" content="Free, colourful learning games for kids — arithmetic, money, time, fractions, patterns and more. No ads, no sign-up." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/site.css" />
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="brandline">
        <svg class="hub-owl"></svg>
        <h1 class="sitetitle" id="sitetitle"></h1>
      </div>
      <p class="tagline">Free, colourful games that make maths &amp; thinking fun. No ads, no sign-up — just play. 🎈</p>
    </header>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search games or skills…" aria-label="Search games" autocomplete="off" />
      <span class="count" id="count"></span>
    </div>
    <div class="age-filter" id="ageFilter" role="group" aria-label="Filter by age"></div>

    <main class="grid" id="grid" aria-live="polite"></main>
    <p class="empty hide" id="empty" style="display:none;">No games match that — try another word. 🔍</p>

    <p class="foot">Made with 🦉 for curious kids. More games coming soon!</p>
  </div>

  <script src="../games.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    "use strict";
    // Bouncy per-letter site title
    (function(){
      const word="Piklu", cls=["c1","c2","c3","c4","c5"], el=document.getElementById("sitetitle");
      const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches; let i=0;
      for(const ch of word){
        if(ch===" "){ el.appendChild(document.createTextNode("\u00A0")); continue; }
        const s=document.createElement("span"); s.textContent=ch; s.className=cls[i++%cls.length];
        if(!reduce) s.style.animation=`bob 2.6s ease-in-out ${(i*0.05).toFixed(2)}s infinite`;
        el.appendChild(s);
      }
      if(!reduce){ const st=document.createElement("style"); st.textContent="@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}"; document.head.appendChild(st); }
    })();

    const GAMES = Array.isArray(window.GAMES) ? window.GAMES : [];
    const grid=document.getElementById("grid"), countEl=document.getElementById("count"),
          emptyEl=document.getElementById("empty"), search=document.getElementById("search"),
          ageFilterEl=document.getElementById("ageFilter");

    function cardHTML(g){
      const skills=(g.skills||[]).map(s=>`<span class="skill">${s}</span>`).join("");
      const badge=g.badge?`<span class="badge">${g.badge}</span>`:"";
      const age=g.ageGroup?`<span class="age-badge">Age: ${g.ageGroup}</span>`:"";
      // URL is always /games/<slug>/ — relative link keeps it stable now and inside a future store.
      return `<a class="game-card acc-${g.accent||'grape'}" href="${g.slug}/" aria-label="${g.title}">
        ${age}
        <div class="game-emoji">${g.emoji||"🎮"}</div>
        <div class="game-title">${g.title}${badge}</div>
        <div class="game-tag">${g.tagline||""}</div>
        <div class="skills">${skills}</div>
        <span class="play">Play ▶</span>
      </a>`;
    }

    function render(list){
      grid.innerHTML=list.map(cardHTML).join("");
      const showing = list.length, total = GAMES.length;
      countEl.textContent = showing===total ? `${total} games` : `${showing} of ${total} games`;
      emptyEl.style.display = showing? "none":"block";
    }

    let ageFilter="all";
    function matches(g,q){
      if(ageFilter!=="all" && g.ageGroup!==ageFilter) return false;
      if(!q) return true;
      const hay=[g.title,g.tagline,...(g.skills||[])].join(" ").toLowerCase();
      return hay.includes(q);
    }

    function applyFilters(){
      const q=search.value.trim().toLowerCase();
      render(GAMES.filter(g=>matches(g,q)));
    }

    (function buildAgeFilter(){
      const ages=Array.from(new Set(GAMES.map(g=>g.ageGroup).filter(Boolean)))
        .sort((a,b)=>parseInt(a,10)-parseInt(b,10));
      const opts=["all",...ages];
      ageFilterEl.innerHTML=opts.map(a=>
        `<button class="age-chip" data-age="${a}" aria-pressed="${a==='all'}">${a==='all'?'All ages':a}</button>`).join("");
      ageFilterEl.querySelectorAll(".age-chip").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          ageFilter=btn.dataset.age;
          ageFilterEl.querySelectorAll(".age-chip").forEach(b=>b.setAttribute("aria-pressed", b===btn));
          applyFilters();
        });
      });
    })();

    search.addEventListener("input", applyFilters);

    render(GAMES);
  </script>
</body>
</html>
