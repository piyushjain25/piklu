<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Color Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/site.css" />
<style>
  .app{max-width:560px;}
  .title{font-size:clamp(25px,5.2vw,40px);}
  .topbar{margin-bottom:16px;}
  svg.monster{width:min(170px,42vw); height:auto; display:block;}
  .diff .mini-slot{width:56px; height:56px;}
  .targetbox{background:var(--paper); border:3px solid var(--paper-line); border-radius:18px; padding:14px 16px;
    margin:8px 0 14px; text-align:center;}
  .target-word{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(30px,8vw,46px); line-height:1;
    text-shadow:0 0 1px rgba(0,0,0,.22);}
  .target-sub{font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink-soft); font-size:14.5px; margin-top:4px;}
  .tile{border:4px solid var(--key-line); border-radius:20px; cursor:pointer; aspect-ratio:1/1; padding:0;
    transition:border-color .15s ease, transform .06s ease;}
  .tile.found{border-color:var(--leaf-dark); box-shadow:0 0 0 4px rgba(47,179,125,.3) inset; cursor:default;}
</style>
</head>
<body class="game">
<div class="app">
  <div class="card">

    <section id="screen-home">
      <div class="home-top"><a class="hub-link" href="../">← All games</a></div>
      <div class="brand">
        <svg class="owl" id="owl-home" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M14 10 L22 20 L10 20 Z" fill="#6C4AB6"/><path d="M50 10 L54 20 L42 20 Z" fill="#6C4AB6"/>
          <circle cx="32" cy="34" r="22" fill="#6C4AB6"/><circle cx="32" cy="38" r="15" fill="#F4EEFF"/>
          <g><circle cx="24" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="24" cy="28" r="4" fill="#33236B"/></g>
          <g><circle cx="40" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="28" r="4" fill="#33236B"/></g>
          <path class="brow brow-l" d="M17 19 Q24 15 31 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path class="brow brow-r" d="M33 19 Q40 15 47 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path class="beak" d="M32 32 L28 38 L36 38 Z" fill="#FFCF43"/>
        </svg>
        <h1 class="title" id="title"></h1>
      </div>
      <p class="subtitle">🎨 Tap the colours that match!</p>
      <div class="block-label">Choose a level</div>
      <div class="diff-grid" role="group" aria-label="Level">
        <button class="diff easy"   data-diff="EASY"   aria-pressed="true"><span class="mini-slot"></span><div class="d-name">🌱 Easy</div><div class="d-range">3 tiles, basic colours</div></button>
        <button class="diff medium" data-diff="MEDIUM" aria-pressed="false"><span class="mini-slot"></span><div class="d-name">⭐ Medium</div><div class="d-range">more colours</div></button>
        <button class="diff hard"   data-diff="HARD"   aria-pressed="false"><span class="mini-slot"></span><div class="d-name">🔥 Hard</div><div class="d-range">match the family</div></button>
        <button class="diff expert" data-diff="EXPERT" aria-pressed="false"><span class="mini-slot"></span><div class="d-name">🏆 Expert</div><div class="d-range">subtle shades</div></button>
      </div>
      <div class="howto">
        🎨 <b>How to play:</b> A colour name appears, written in that colour — tap the swatch that matches!
        On <b>Hard</b> and <b>Expert</b>, tap <b>all</b> the matching swatches to finish the round.
        Look closely — some colours are tricky look-alikes!
      </div>
      <div class="row-btns mt"><button id="start-btn" class="btn btn-go btn-lg">Start ▶</button></div>
    </section>

    <section id="screen-game" class="hide">
      <div class="topbar">
        <button id="home-btn" class="tlink">🏠 Home</button>
        <div class="tb-center">
          <svg class="owl" id="owl-game" viewBox="0 0 64 64" aria-hidden="true" style="width:40px;height:40px;">
            <path d="M14 10 L22 20 L10 20 Z" fill="#6C4AB6"/><path d="M50 10 L54 20 L42 20 Z" fill="#6C4AB6"/>
            <circle cx="32" cy="34" r="22" fill="#6C4AB6"/><circle cx="32" cy="38" r="15" fill="#F4EEFF"/>
            <g><circle cx="24" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="24" cy="28" r="4" fill="#33236B"/></g>
            <g><circle cx="40" cy="28" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="28" r="4" fill="#33236B"/></g>
            <path class="brow brow-l" d="M17 19 Q24 15 31 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path class="brow brow-r" d="M33 19 Q40 15 47 19" stroke="#4b2f8f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path class="beak" d="M32 32 L28 38 L36 38 Z" fill="#FFCF43"/>
          </svg>
          <div class="level-switch">
            <button class="chip level" id="q-level" aria-haspopup="true" aria-expanded="false" aria-label="Change level">
              <span id="q-level-label">🌱 Easy</span><span class="caret">▾</span>
            </button>
            <div class="level-menu" id="level-menu" role="menu"></div>
          </div>
        </div>
        <div class="tb-right">
          <button id="skip-btn" class="tlink">⏭ Skip</button>
        </div>
      </div>

      <div class="stagewrap">
        <div class="monster-host" id="monster-host"></div>
        <div class="monster-name" id="monster-name"></div>
      </div>

      <div class="targetbox">
        <div class="target-word" id="target-word">Red</div>
        <div class="target-sub" id="target-sub">Tap the Red tile!</div>
      </div>

      <div class="tilegrid" id="tilegrid" role="group" aria-label="Colour tiles"></div>

      <div id="result-view" class="hide"><div class="result"><div class="rlabel" id="rlabel"></div></div></div>
      <div class="feedback" id="feedback"></div>
      <div id="serve-view">
        <div class="actions">
          <button id="hint-link" class="tlink">💡 Hint</button>
        </div>
      </div>
      <div class="serve-row">
        <button id="next-btn" class="btn btn-primary btn-lg hide">Next ▶</button>
      </div>
    </section>
  </div>
</div>
<canvas id="confetti"></canvas>

<script src="../../assets/site.js"></script>
<script>
"use strict";
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ===== engine (verified offline — see test-color-match.js) ===== */
const NAMES={red:"Red",blue:"Blue",yellow:"Yellow",green:"Green",orange:"Orange",purple:"Purple",pink:"Pink",brown:"Brown",black:"Black",white:"White"};
const BASE={red:"#E5484D",blue:"#3B82F6",yellow:"#FFD43B",green:"#22C55E",orange:"#FF8C42",purple:"#8B5CF6",pink:"#FF6B9D",brown:"#8B5E3C",black:"#1F2430",white:"#FFFFFF"};
const FAMILIES={
  red:["#FFADAD","#E5484D","#9F1D24"], blue:["#A9D6FF","#3B82F6","#1E3A8A"], green:["#B7F0C0","#22C55E","#166534"],
  yellow:["#FFF3A3","#FFD43B","#B8860B"], purple:["#D9C7FF","#8B5CF6","#4C2A85"], orange:["#FFD1A3","#FF8C42","#B85C00"],
};
const CONFUSABLE={red:"pink", pink:"orange", orange:"red", blue:"purple", purple:"blue", green:"yellow", yellow:"green"};
const LEVELS={
  EASY:  { kinds:["red","blue","yellow","green"],                                            tiles:3, minT:1, maxT:1, label:"🌱 Easy" },
  MEDIUM:{ kinds:["red","blue","yellow","green","orange","purple","pink","brown","black","white"], tiles:5, minT:1, maxT:1, label:"⭐ Medium" },
  HARD:  { kinds:Object.keys(FAMILIES),                                                       tiles:6, minT:2, maxT:3, shades:FAMILIES, label:"🔥 Hard" },
  EXPERT:{ kinds:["red","pink","orange","blue","purple","green","yellow","brown","black"],      tiles:9, minT:2, maxT:4, label:"🏆 Expert" },
};
function tileHex(cfg, kind){ return cfg.shades ? cfg.shades[kind][rnd(cfg.shades[kind].length)] : BASE[kind]; }
function displayHex(cfg, kind){ return cfg.shades ? cfg.shades[kind][1] : BASE[kind]; }
function genRound(level){
  const cfg=LEVELS[level];
  const target=cfg.kinds[rnd(cfg.kinds.length)];
  const rawCount=cfg.minT+rnd(cfg.maxT-cfg.minT+1);
  const targetCount=Math.min(rawCount, cfg.tiles-1);
  const numDistractors=cfg.tiles-targetCount;
  const distractorPool=cfg.kinds.filter(k=>k!==target);
  const distractorKinds=[];
  const confusable=CONFUSABLE[target];
  if(confusable && distractorPool.includes(confusable) && numDistractors>0) distractorKinds.push(confusable);
  while(distractorKinds.length<numDistractors) distractorKinds.push(distractorPool[rnd(distractorPool.length)]);
  const tiles=[];
  for(let i=0;i<targetCount;i++) tiles.push({kind:target, correct:true});
  for(let i=0;i<numDistractors;i++) tiles.push({kind:distractorKinds[i], correct:false});
  shuffle(tiles);
  tiles.forEach((t,i)=>{ t.id=i; t.hex=tileHex(cfg,t.kind); t.found=false; });
  return { level, target, targetCount, tiles };
}
if(typeof module!=="undefined") module.exports={ genRound, LEVELS, NAMES, BASE, FAMILIES, CONFUSABLE, displayHex };

/* ===== monster art — a distinct character per level, shown in its own colour
   on the level-select cards; in-game it recolours each round to match the
   colour currently in question ===== */
const LEVEL_MONSTERS={
  EASY:  { name:"Splash", color:"#3FA7E0", deep:"#2b86ba", soft:"#D6EFFB", horn:"antenna", eyes:2 },
  MEDIUM:{ name:"Dot",    color:"#FFCF43", deep:"#e6a800", soft:"#FFF6D6", horn:"ears",    eyes:2 },
  HARD:  { name:"Swirl",  color:"#8B5CF6", deep:"#4C2A85", soft:"#EAE0FF", horn:"spikes",  eyes:3 },
  EXPERT:{ name:"Prism",  color:"#FF6B7A", deep:"#e24a5c", soft:"#FFE0E3", horn:"crown",   eyes:3 },
};
const MONSTER_PALETTE={
  red:    { color:"#E5484D", deep:"#B91C2C", soft:"#FFD9DB" },
  blue:   { color:"#3B82F6", deep:"#1E3A8A", soft:"#D6E6FF" },
  yellow: { color:"#FFD43B", deep:"#B8860B", soft:"#FFF6D6" },
  green:  { color:"#22C55E", deep:"#166534", soft:"#D9F7E1" },
  orange: { color:"#FF8C42", deep:"#B85C00", soft:"#FFE3CC" },
  purple: { color:"#8B5CF6", deep:"#4C2A85", soft:"#EAE0FF" },
  pink:   { color:"#FF6B9D", deep:"#B8305F", soft:"#FFE0EC" },
  brown:  { color:"#8B5E3C", deep:"#5C3D24", soft:"#EAD9C8" },
  black:  { color:"#1F2430", deep:"#000000", soft:"#D8DAE0" },
  white:  { color:"#FFFFFF", deep:"#B8BCC4", soft:"#F3F4F6" },
};
function monsterCfg(levelKey, colorKind){
  const id=LEVEL_MONSTERS[levelKey], pal=MONSTER_PALETTE[colorKind];
  return { name:id.name, horn:id.horn, eyes:id.eyes, color:pal.color, deep:pal.deep, soft:pal.soft };
}
let monsterSeq=0;
function monsterSVG(cfg, withBelly){
  const uid='cm'+(monsterSeq++);
  const c=cfg.color, deep=cfg.deep, soft=cfg.soft, belly=cfg.color;
  const eyePositions = cfg.eyes===2 ? [[95,108],[145,108]] : [[80,110],[120,100],[160,110]];
  const eyeMarkup=eyePositions.map(p=>
    `<g class="eye"><ellipse cx="${p[0]}" cy="${p[1]}" rx="19" ry="22" fill="#fff"/><circle class="pupil" cx="${p[0]}" cy="${p[1]+3}" r="9" fill="#3a2b4a"/><circle cx="${p[0]-3}" cy="${p[1]-2}" r="3.2" fill="#fff"/></g>`
  ).join('');
  let top;
  if(cfg.horn==='antenna'){
    top = `<line x1="90" y1="55" x2="74" y2="18" stroke="${deep}" stroke-width="7" stroke-linecap="round"/><circle cx="72" cy="14" r="10" fill="${soft}"/><line x1="150" y1="55" x2="166" y2="18" stroke="${deep}" stroke-width="7" stroke-linecap="round"/><circle cx="168" cy="14" r="10" fill="${soft}"/>`;
  } else if(cfg.horn==='spikes'){
    top = `<path d="M78,55 L64,14 L100,46 Z" fill="${deep}"/><path d="M120,50 L120,6 L142,44 Z" fill="${deep}"/><path d="M162,55 L176,14 L140,46 Z" fill="${deep}"/>`;
  } else if(cfg.horn==='ears'){
    top = `<ellipse cx="66" cy="46" rx="22" ry="30" fill="${c}" stroke="rgba(0,0,0,.14)" stroke-width="3"/><ellipse cx="66" cy="46" rx="10" ry="16" fill="${soft}"/><ellipse cx="174" cy="46" rx="22" ry="30" fill="${c}" stroke="rgba(0,0,0,.14)" stroke-width="3"/><ellipse cx="174" cy="46" rx="10" ry="16" fill="${soft}"/>`;
  } else {
    top = `<circle cx="88" cy="40" r="12" fill="${c}"/><circle cx="120" cy="32" r="14" fill="${c}"/><circle cx="152" cy="40" r="12" fill="${c}"/>`;
  }
  let bellyMarkup;
  if(withBelly){
    bellyMarkup = `<clipPath id="bc_${uid}"><ellipse cx="120" cy="176" rx="58" ry="52"/></clipPath>
      <ellipse cx="120" cy="176" rx="58" ry="52" fill="${soft}"/>
      <g clip-path="url(#bc_${uid})"><rect class="belly-fill" x="60" y="124" width="120" height="104" fill="${belly}" transform="translate(0,104)"/></g>
      <ellipse cx="120" cy="176" rx="58" ry="52" fill="none" stroke="${deep}" stroke-width="4" opacity=".25"/>`;
  } else {
    bellyMarkup = `<ellipse cx="120" cy="176" rx="52" ry="46" fill="${soft}"/>`;
  }
  return `<svg class="monster${withBelly?'':' mini'}" viewBox="0 0 240 270" aria-hidden="true">
    ${top}
    <ellipse cx="88" cy="242" rx="26" ry="18" fill="${deep}"/>
    <ellipse cx="152" cy="242" rx="26" ry="18" fill="${deep}"/>
    <path d="M120,52 C60,52 40,110 44,158 C48,214 78,244 120,244 C162,244 192,214 196,158 C200,110 180,52 120,52 Z" fill="${c}" stroke="rgba(0,0,0,.14)" stroke-width="3"/>
    <ellipse cx="46" cy="168" rx="16" ry="26" fill="${c}" stroke="rgba(0,0,0,.14)" stroke-width="3" transform="rotate(-18 46 168)"/>
    <ellipse cx="194" cy="168" rx="16" ry="26" fill="${c}" stroke="rgba(0,0,0,.14)" stroke-width="3" transform="rotate(18 194 168)"/>
    ${bellyMarkup}
    <circle cx="74" cy="140" r="12" fill="${deep}" opacity=".18"/>
    <circle cx="166" cy="140" r="12" fill="${deep}" opacity=".18"/>
    ${eyeMarkup}
    <path class="mouth-smile" d="M96,132 Q120,152 144,132" stroke="#3a2b4a" stroke-width="6" fill="none" stroke-linecap="round" style="opacity:1"/>
    <ellipse class="mouth-open" cx="120" cy="140" rx="26" ry="18" fill="#5a2a3a" style="opacity:0"/>
    <ellipse class="tongue" cx="120" cy="150" rx="15" ry="9" fill="#ff8fa3" style="opacity:0"/>
  </svg>`;
}

/* ===== state ===== */
let level="EASY", R=null, found=0, phase='play', sadTimer=null, chompTimer=null, prevSig=null;
function setLevel(l){
  level=l;
  document.querySelectorAll(".diff").forEach(b=>b.setAttribute("aria-pressed", b.dataset.diff===l));
  const lbl=$("q-level-label"); if(lbl) lbl.textContent=LEVELS[l].label;
  document.querySelectorAll(".level-opt").forEach(b=>b.setAttribute("aria-current", b.dataset.diff===l));
}
document.querySelectorAll(".diff").forEach(b=>{
  b.onclick=()=>setLevel(b.dataset.diff);
  const slot=b.querySelector(".mini-slot");
  if(slot) slot.innerHTML=monsterSVG(LEVEL_MONSTERS[b.dataset.diff], false);
});

// level switcher (tap the chip at the top to change difficulty mid-game)
(function buildLevelMenu(){
  const menu=$("level-menu");
  menu.innerHTML=Object.entries(LEVELS).map(([k,v])=>
    `<button class="level-opt" role="menuitemradio" data-diff="${k}" aria-current="false"><span>${v.label}</span><span class="tick">✓</span></button>`).join('');
  menu.querySelectorAll(".level-opt").forEach(b=> b.onclick=()=>pickLevel(b.dataset.diff));
})();
function pickLevel(l){ closeLevelMenu(); if(l===level) return; setLevel(l); newRound(false); }
wireLevelMenu();
$("start-btn").onclick=()=>newRound(true); $("home-btn").onclick=goHome;
$("skip-btn").onclick=()=>newRound(false); $("next-btn").onclick=()=>newRound(false);
$("hint-link").onclick=giveHint;

const sig = r => r.target+":"+r.tiles.map(t=>t.kind).join(",");
function newRound(fromHome){
  clearTimeout(sadTimer); clearTimeout(chompTimer);
  let r; for(let a=0;a<40;a++){ r=genRound(level); if(!prevSig || sig(r)!==prevSig) break; }
  R=r; prevSig=sig(R); found=0; phase='play';
  if(fromHome){ $("screen-home").classList.add("hide"); $("screen-game").classList.remove("hide"); }
  setLevel(level);
  const rep=displayHex(LEVELS[level], R.target);
  $("monster-host").innerHTML = monsterSVG(monsterCfg(level, R.target), true);
  $("monster-name").textContent = LEVEL_MONSTERS[level].name;
  $("target-word").textContent = NAMES[R.target]; $("target-word").style.color = rep;
  renderTiles(); updatePrompt();
  $("result-view").classList.add("hide"); $("tilegrid").classList.remove("hide");
  $("serve-view").classList.remove("hide"); $("next-btn").classList.add("hide");
  $("skip-btn").classList.remove("invisible"); $("hint-link").classList.remove("off");
  flash(R.targetCount>1?"Tap every matching tile!":"Tap the matching tile!", '');
}
function renderTiles(){
  const grid=$("tilegrid"); const n=R.tiles.length;
  const cols = n<=3?3 : n===4?2 : 3;
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.innerHTML="";
  R.tiles.forEach(t=>{
    const b=document.createElement('button'); b.className='tile'; b.dataset.id=t.id;
    b.style.background=t.hex; b.setAttribute('aria-label', NAMES[t.kind]+' swatch');
    b.onclick=()=>pickTile(t,b);
    grid.appendChild(b);
  });
}
function updatePrompt(){
  const name=NAMES[R.target];
  $("target-sub").textContent = R.targetCount>1
    ? `Tap all the ${name} tiles! (${found} of ${R.targetCount} found)`
    : `Tap the ${name} tile!`;
}
function pickTile(t,btn){
  if(phase!=='play' || t.found) return;
  if(t.correct){
    t.found=true; found++; btn.classList.add('found'); btn.disabled=true;
    setMonster('chomp'); sound('good'); updatePrompt();
    if(found>=R.targetCount) roundComplete();
    else flash(`Yes! ${found} of ${R.targetCount} found 🎯`, 'good');
  } else {
    btn.classList.remove('wrong-flash'); void btn.offsetWidth; btn.classList.add('wrong-flash');
    setMonster('sad'); sound('bad');
    flash(`That's not ${NAMES[R.target]} — try again!`, 'bad');
    clearTimeout(sadTimer); sadTimer=setTimeout(()=>{ if(phase==='play') setMonster('idle'); }, 900);
  }
}
function roundComplete(){
  phase='done';
  $("tilegrid").classList.add("hide"); $("result-view").classList.remove("hide"); $("serve-view").classList.add("hide");
  const name=NAMES[R.target];
  $("rlabel").textContent = R.targetCount>1 ? `🎉 You found every ${name} tile!` : `🎉 That's ${name}!`;
  $("skip-btn").classList.add("invisible");
  $("next-btn").classList.remove("hide"); $("next-btn").focus(); flash('', '');
  if(!reduceMotion) miniConfetti(); sound('win');
}
function giveHint(){
  if(phase!=='play') return;
  const btns=[...$("tilegrid").querySelectorAll('.tile')];
  const target=R.tiles.find((t,i)=>t.correct && !t.found && btns[i] && !btns[i].classList.contains('hintglow'));
  if(!target) return;
  const idx=R.tiles.indexOf(target); const btn=btns[idx];
  btn.classList.remove('hintglow'); void btn.offsetWidth; btn.classList.add('hintglow');
  setTimeout(()=>btn.classList.remove('hintglow'), 1150);
  flash(`💡 Look closely at that one!`, 'hint');
}
function setMonster(mood){
  const m=$("monster-host").querySelector('.monster'); if(!m) return;
  m.classList.remove('sad','chomp'); clearTimeout(chompTimer);
  const smile=m.querySelector('.mouth-smile'), open=m.querySelector('.mouth-open'), tongue=m.querySelector('.tongue'), belly=m.querySelector('.belly-fill');
  if(mood==='chomp'){
    m.classList.add('chomp');
    if(smile) smile.style.opacity='0'; if(open) open.style.opacity='1'; if(tongue) tongue.style.opacity='1';
    if(belly) belly.setAttribute('transform','translate(0,0)');
    chompTimer=setTimeout(()=>{ if(smile) smile.style.opacity='1'; if(open) open.style.opacity='0'; if(tongue) tongue.style.opacity='0'; }, 380);
  } else if(mood==='sad'){
    m.classList.add('sad');
  } else {
    if(smile) smile.style.opacity='1'; if(open) open.style.opacity='0'; if(tongue) tongue.style.opacity='0';
  }
}
function goHome(){ clearTimeout(sadTimer); clearTimeout(chompTimer); stopConfetti(); R=null; $("screen-game").classList.add("hide"); $("screen-home").classList.remove("hide"); }

document.addEventListener("keydown", e=>{
  if(e.key==='Escape'){ closeLevelMenu(); }
  if($("screen-game").classList.contains("hide") || !R) return;
  if(e.target && e.target.id==='hint-link') return;
  if(e.key==='Enter' && phase==='done'){ e.preventDefault(); newRound(false); }
  if(e.key.toLowerCase()==='h' && phase==='play') giveHint();
});

/* ===== sound / confetti / title (beep/stopConfetti/initBouncyTitle are shared in site.js) ===== */
function sound(kind){ if(kind==="good") beep(660,.08,"triangle",0,.08); else if(kind==="bad") beep(190,.16,"sawtooth",0,.10); else if(kind==="win") [523,659,784,1047].forEach((f,i)=>beep(f,.16,"triangle",i*.08)); }
function miniConfetti(){ const cv=$("confetti"); cv.style.display="block"; const ctx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const colors=["#6C4AB6","#2FB37D","#FFCF43","#3FA7E0","#FF6B7A","#FF8C42"];
  const parts=Array.from({length:75},()=>({x:cv.width/2,y:cv.height*0.35,r:5+Math.random()*7,c:colors[Math.floor(Math.random()*colors.length)],vy:-5+Math.random()*2,vx:-6+Math.random()*12,rot:0,vr:.25}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height); parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    f++; if(f<75) confettiRAF=requestAnimationFrame(draw); else stopConfetti();})(); }

initBouncyTitle("Color Match");
setLevel("EASY");
